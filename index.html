<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>งามตา SHOP POS</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: { extend: { colors: { primary:'#16a34a', primaryDark:'#15803d', primarySoft:'#dcfce7' } } }
    }
  </script>
  <style>
    *{font-family:'Prompt',sans-serif;box-sizing:border-box}
    html,body{height:100%;margin:0;background:#f6f8f7;color:#111827}
    body{overflow:hidden}
    .shadow-card{box-shadow:0 8px 26px rgba(15,23,42,.06)}
    .soft-border{border:1px solid #e5e7eb}
    .btn{min-height:46px}\n    #reader video{width:100%!important;border-radius:16px} #reader{min-height:260px;background:#f3f4f6}
    .page{display:none;height:100%;overflow:auto;-webkit-overflow-scrolling:touch}
    .page.active{display:block}
    .side-active{background:#16a34a;color:#fff}
    .side-active svg{color:#fff}
    #print-area{display:none}
    .drawer-backdrop{display:none}
    .mobile-menu{display:none}
    .mobile-cart{display:none}
    @media(max-width:1024px){
      body{overflow:auto}
      .app{display:block;height:auto;min-height:100dvh}
      .sidebar{
        position:fixed;left:0;top:0;bottom:0;width:280px;z-index:60;
        transform:translateX(-105%);transition:.25s;background:white;
      }
      .sidebar.open{transform:translateX(0)}
      .drawer-backdrop.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:55}
      .main{height:auto;min-height:100dvh}
      .topbar{position:sticky;top:0;z-index:40}
      .mobile-menu{display:flex}
      .page{height:auto;min-height:calc(100dvh - 64px);overflow:visible;padding:12px!important}
      .sales-layout{display:block;height:auto;overflow:visible}
      .product-area{height:auto;overflow:visible;padding:12px!important}
      .product-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}
      .cart-panel{
        position:fixed;inset:0;width:100%!important;height:100dvh!important;z-index:70;
        transform:translateX(100%);transition:.25s;
      }
      .cart-panel.open{transform:translateX(0)}
      .mobile-cart{display:flex;position:fixed;right:14px;bottom:14px;z-index:50}
      .desktop-only{display:none!important}
      .search-row{display:block}
      .scan-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
      .responsive-table,.responsive-table thead,.responsive-table tbody,.responsive-table tr,.responsive-table td,.responsive-table th{display:block}
      .responsive-table thead{display:none}
      .responsive-table tr{border:1px solid #e5e7eb;border-radius:18px;margin:10px 0;padding:12px;background:white}
      .responsive-table td{padding:5px 0!important;text-align:left!important}
      .modal-card{max-height:92dvh;overflow:auto}
    }
    @media(min-width:1025px){
      .app{height:100%;display:flex}
      .sidebar{width:280px;flex-shrink:0}
      .main{height:100%;min-width:0;flex:1;display:flex;flex-direction:column}
      .sales-layout{height:100%;display:flex;overflow:hidden}
      .product-area{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
      .product-scroll{flex:1;overflow:auto}
      .cart-panel{width:460px;flex-shrink:0}
      .mobile-only{display:none!important}
    }
    @media print{
      @page{margin:4mm}
      body *{visibility:hidden!important}
      #print-area,#print-area *{visibility:visible!important}
      #print-area{display:block!important;position:absolute;left:0;top:0;width:80mm;background:#fff;color:#111;padding:6px}
      .receipt-print{width:72mm;margin:0 auto;font-family:monospace;font-size:12px;line-height:1.35}
      .barcode-label{page-break-inside:avoid;border:1px dashed #999;padding:6px;margin:4px 0;text-align:center;width:68mm}
      .barcode-label svg{max-width:100%}
    }
  </style>
</head>
<body>
<div class="app">
  <aside id="sidebar" class="sidebar bg-white shadow-card flex flex-col">
    <div class="p-5 border-b">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-2xl bg-primary text-white flex items-center justify-center"><i data-lucide="store"></i></div>
        <div>
          <h1 class="font-bold text-xl text-primary">งามตา SHOP</h1>
          <p class="text-xs text-gray-400">POS</p>
        </div>
      </div>
    </div>
    <nav class="p-3 space-y-1 flex-1 overflow-auto">
      <button data-page="sales" class="nav-btn side-active w-full text-left flex items-center gap-3 px-4 py-3 rounded-2xl font-semibold"><i data-lucide="shopping-cart"></i>ขายสินค้า</button>
      <button data-page="history" class="nav-btn w-full text-left flex items-center gap-3 px-4 py-3 rounded-2xl font-semibold text-gray-600 hover:bg-gray-50"><i data-lucide="receipt"></i>ประวัติบิล</button>
      <button data-page="products" class="nav-btn w-full text-left flex items-center gap-3 px-4 py-3 rounded-2xl font-semibold text-gray-600 hover:bg-gray-50"><i data-lucide="package"></i>สินค้า</button>
      <button data-page="stock" class="nav-btn w-full text-left flex items-center gap-3 px-4 py-3 rounded-2xl font-semibold text-gray-600 hover:bg-gray-50"><i data-lucide="warehouse"></i>สต๊อก</button>
      <button data-page="returns" class="nav-btn w-full text-left flex items-center gap-3 px-4 py-3 rounded-2xl font-semibold text-gray-600 hover:bg-gray-50"><i data-lucide="refresh-cw"></i>คืน/เปลี่ยน</button>
      <button data-page="reports" class="nav-btn w-full text-left flex items-center gap-3 px-4 py-3 rounded-2xl font-semibold text-gray-600 hover:bg-gray-50"><i data-lucide="bar-chart-3"></i>รายงาน</button>
      <button data-page="settings" class="nav-btn w-full text-left flex items-center gap-3 px-4 py-3 rounded-2xl font-semibold text-gray-600 hover:bg-gray-50"><i data-lucide="settings"></i>ตั้งค่า</button>
    </nav>
  </aside>
  <div id="drawerBack" class="drawer-backdrop" onclick="closeDrawer()"></div>

  <main class="main">
    <header class="topbar bg-white shadow-card px-4 lg:px-6 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3 min-w-0">
        <button onclick="openDrawer()" class="mobile-menu w-11 h-11 rounded-2xl bg-primary text-white items-center justify-center"><i data-lucide="menu"></i></button>
        <div class="min-w-0">
          <h2 class="font-bold text-lg lg:text-xl truncate">งามตา SHOP</h2>
          <p id="datetime" class="text-xs lg:text-sm text-gray-500 truncate"></p>
        </div>
      </div>
      <div class="desktop-only flex items-center gap-3">
        <div class="bg-primarySoft px-4 py-2 rounded-2xl"><span class="text-xs text-gray-500">ยอดขายวันนี้</span><b id="todaySales" class="block text-primary">0.00 บาท</b></div>
        <div class="bg-gray-50 px-4 py-2 rounded-2xl font-semibold">แอดมิน</div>
      </div>
    </header>

    <section id="page-sales" class="page active p-0">
      <div class="sales-layout">
        <div class="product-area p-5">
          <div class="search-row mb-3">
            <div class="relative">
              <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
              <input id="searchInput" class="w-full pl-12 pr-4 py-4 rounded-2xl bg-white soft-border text-base focus:outline-none focus:ring-2 focus:ring-green-200" placeholder="ค้นหา / สแกนบาร์โค้ด">
            </div>
            <div class="scan-row lg:hidden">
              <button onclick="focusScanner()" class="btn bg-white soft-border rounded-2xl font-semibold flex items-center justify-center gap-2"><i data-lucide="scan-line"></i>สแกนเนอร์</button>
              <button onclick="openCameraScanner()" class="btn bg-primary text-white rounded-2xl font-semibold flex items-center justify-center gap-2"><i data-lucide="camera"></i>กล้อง</button>
            </div>
          </div>
          <div class="desktop-only flex gap-2 mb-3">
            <button onclick="focusScanner()" class="btn px-4 bg-white soft-border rounded-2xl font-semibold flex items-center gap-2"><i data-lucide="scan-line"></i>สแกนเนอร์</button>
            <button onclick="openCameraScanner()" class="btn px-4 bg-primary text-white rounded-2xl font-semibold flex items-center gap-2"><i data-lucide="camera"></i>สแกนกล้อง</button>
          </div>
          <div id="catFilters" class="flex gap-2 overflow-x-auto pb-2 mb-3"></div>
          <div class="product-scroll">
            <div id="productGrid" class="product-grid grid grid-cols-2 xl:grid-cols-4 2xl:grid-cols-5 gap-3"></div>
          </div>
        </div>

        <aside id="cartPanel" class="cart-panel bg-white shadow-card flex flex-col">
          <div class="px-5 py-4 border-b flex items-center justify-between">
            <div class="flex items-center gap-2">
              <button onclick="closeCart()" class="mobile-only w-10 h-10 rounded-xl bg-gray-100 flex items-center justify-center"><i data-lucide="arrow-left"></i></button>
              <h3 class="font-bold text-xl">ตะกร้า</h3>
            </div>
            <span id="cartCount" class="text-sm text-gray-500">0 รายการ</span>
          </div>
          <div id="cartItems" class="flex-1 overflow-auto p-5"></div>
          <div class="border-t p-4 space-y-3">
            <button onclick="toggleDiscount()" class="text-primary font-semibold">ส่วนลดทั้งบิล</button>
            <div id="discountBox" class="hidden space-y-2">
              <div class="grid grid-cols-2 gap-2">
                <button id="discPercent" onclick="setDiscountType('percent')" class="btn bg-primary text-white rounded-xl font-semibold">%</button>
                <button id="discFixed" onclick="setDiscountType('fixed')" class="btn bg-gray-100 rounded-xl font-semibold">บาท</button>
              </div>
              <input id="discountValue" type="number" class="w-full p-3 rounded-xl soft-border" placeholder="ส่วนลด">
              <select id="discountReason" class="w-full p-3 rounded-xl soft-border">
                <option value="">เหตุผล</option><option>ลูกค้าประจำ</option><option>โปรโมชั่น</option><option>อื่น ๆ</option>
              </select>
            </div>
          </div>
          <div class="border-t p-4 space-y-3">
            <div class="grid grid-cols-3 gap-2">
              <button id="payCash" onclick="setPayment('cash')" class="btn bg-primary text-white rounded-xl font-semibold">เงินสด</button>
              <button id="payTransfer" onclick="setPayment('transfer')" class="btn bg-gray-100 rounded-xl font-semibold">โอน</button>
              <button id="payOther" onclick="setPayment('other')" class="btn bg-gray-100 rounded-xl font-semibold">อื่น ๆ</button>
            </div>
            <div id="cashBox">
              <input id="cashReceived" type="number" class="w-full p-3 rounded-xl soft-border" placeholder="รับเงิน">
              <div class="flex justify-between mt-2"><span>เงินทอน</span><b id="changeText" class="text-primary">0.00 บาท</b></div>
            </div>
            <div id="otherBox" class="hidden space-y-2">
              <select id="otherType" class="w-full p-3 rounded-xl soft-border"><option>ใช้สิทธิ์</option><option>ฟรี</option><option>เบิกบริษัท</option><option>เครดิตร้าน</option><option>อื่น ๆ</option></select>
              <input id="otherDetail" class="w-full p-3 rounded-xl soft-border" placeholder="รายละเอียด">
            </div>
          </div>
          <div class="border-t bg-gray-50 p-4">
            <div class="flex justify-between"><span>ยอดรวม</span><b id="subtotalText">0.00 บาท</b></div>
            <div class="flex justify-between text-red-500"><span>ส่วนลด</span><b id="discountText">-0.00 บาท</b></div>
            <div class="flex justify-between items-center mt-2"><span class="font-bold">ยอดสุทธิ</span><b id="netText" class="text-2xl text-primary">0.00 บาท</b></div>
          </div>
          <div class="border-t p-4 grid grid-cols-4 gap-2">
            <button onclick="checkout()" class="btn col-span-2 bg-primary hover:bg-primaryDark text-white rounded-2xl font-bold">ชำระเงิน</button>
            <button onclick="clearCart()" class="btn bg-gray-100 rounded-2xl font-semibold">ล้าง</button>
            <button onclick="holdBill()" class="btn bg-gray-100 rounded-2xl font-semibold">พัก</button>
          </div>
        </aside>
      </div>
    </section>

    <section id="page-history" class="page p-4 lg:p-6"></section>
    <section id="page-products" class="page p-4 lg:p-6"></section>
    <section id="page-stock" class="page p-4 lg:p-6"></section>
    <section id="page-returns" class="page p-4 lg:p-6"></section>
    <section id="page-reports" class="page p-4 lg:p-6"></section>
    <section id="page-settings" class="page p-4 lg:p-6"></section>
  </main>
</div>

<button onclick="openCart()" class="mobile-cart btn bg-primary text-white rounded-full px-5 py-3 items-center gap-2 font-bold shadow-card">
  <i data-lucide="shopping-cart"></i><span>ตะกร้า</span><span id="mobileCartCount" class="bg-white text-primary rounded-full px-2">0</span>
</button>

<div id="successModal" class="hidden fixed inset-0 bg-black/40 z-[90] p-4 flex items-center justify-center">
  <div class="modal-card bg-white rounded-3xl p-6 max-w-md w-full text-center shadow-card">
    <div class="w-16 h-16 mx-auto bg-primarySoft text-primary rounded-full flex items-center justify-center mb-3"><i data-lucide="check"></i></div>
    <h3 class="text-2xl font-bold">ชำระเงินสำเร็จ</h3>
    <p id="successBill" class="text-gray-500 mt-1 mb-4"></p>
    <div class="space-y-2">
      <button onclick="printReceipt()" class="btn w-full bg-primary text-white rounded-2xl font-bold">พิมพ์ใบเสร็จ</button>
      <button onclick="previewReceipt()" class="btn w-full bg-gray-100 rounded-2xl font-bold">ดูใบเสร็จ</button>
      <button onclick="closeSuccess()" class="btn w-full soft-border rounded-2xl font-bold">ไม่พิมพ์</button>
    </div>
  </div>
</div>

<div id="previewModal" class="hidden fixed inset-0 bg-black/40 z-[90] p-4 flex items-center justify-center">
  <div class="modal-card bg-white rounded-3xl p-5 max-w-md w-full shadow-card">
    <div class="flex items-center justify-between mb-3"><h3 class="font-bold text-xl">ใบเสร็จ</h3><button onclick="closePreview()" class="w-10 h-10 rounded-xl bg-gray-100 flex items-center justify-center"><i data-lucide="x"></i></button></div>
    <div id="receiptPreview" class="bg-gray-50 rounded-2xl p-4"></div>
    <button onclick="printReceipt()" class="btn w-full mt-3 bg-primary text-white rounded-2xl font-bold">พิมพ์</button>
  </div>
</div>

<div id="barcodeModal" class="hidden fixed inset-0 bg-black/40 z-[90] p-4 flex items-center justify-center">
  <div class="modal-card bg-white rounded-3xl p-5 max-w-md w-full shadow-card">
    <div class="flex items-center justify-between mb-3"><h3 class="font-bold text-xl">บาร์โค้ด</h3><button onclick="closeBarcodeModal()" class="w-10 h-10 rounded-xl bg-gray-100 flex items-center justify-center"><i data-lucide="x"></i></button></div>
    <div id="barcodeContent" class="bg-gray-50 rounded-2xl p-4 text-center"></div>
    <button onclick="printCurrentBarcode()" class="btn w-full mt-3 bg-primary text-white rounded-2xl font-bold">พิมพ์</button>
  </div>
</div>

<div id="scannerModal" class="hidden fixed inset-0 bg-black/50 z-[95] p-4 flex items-center justify-center">
  <div class="modal-card bg-white rounded-3xl p-5 max-w-lg w-full shadow-card">
    <div class="flex items-center justify-between mb-3"><h3 class="font-bold text-xl">สแกนด้วยกล้อง</h3><button onclick="closeCameraScanner()" class="w-10 h-10 rounded-xl bg-gray-100 flex items-center justify-center"><i data-lucide="x"></i></button></div>
    <div id="reader" class="rounded-2xl overflow-hidden soft-border"></div>
    <p id="scanStatus" class="text-sm text-gray-500 mt-3">วางบาร์โค้ดแนวนอนให้อยู่กลางกรอบ และให้แสงพอ</p>
  </div>
</div>

<div id="toast" class="hidden fixed right-4 bottom-4 z-[100] bg-gray-900 text-white px-5 py-3 rounded-2xl shadow-card"></div>
<div id="print-area"></div>

<script>
const KEY='ngamta_shop_pos_working_v1';
const defaultDB={
  settings:{storeName:'งามตา SHOP',cashier:'แอดมิน',footer:'ขอบคุณที่ใช้บริการ'},
  products:[
    {id:'TSH-BLK-S',barcode:'240001000101',name:'เสื้อยืด Basic',type:'เสื้อ',cat:'เสื้อยืด',size:'S',color:'ดำ',price:199,cost:120,stock:10,img:'https://images.pexels.com/photos/8532616/pexels-photo-8532616.jpeg?auto=compress&cs=tinysrgb&w=400'},
    {id:'TSH-BLK-M',barcode:'240001000102',name:'เสื้อยืด Basic',type:'เสื้อ',cat:'เสื้อยืด',size:'M',color:'ดำ',price:199,cost:120,stock:8,img:'https://images.pexels.com/photos/8532616/pexels-photo-8532616.jpeg?auto=compress&cs=tinysrgb&w=400'},
    {id:'TSH-WHT-M',barcode:'240001000103',name:'เสื้อยืด Basic',type:'เสื้อ',cat:'เสื้อยืด',size:'M',color:'ขาว',price:199,cost:120,stock:12,img:'https://images.pexels.com/photos/8532616/pexels-photo-8532616.jpeg?auto=compress&cs=tinysrgb&w=400'},
    {id:'JEANS-BLUE-M',barcode:'240001000104',name:'กางเกงยีนส์ทรงตรง',type:'กางเกง',cat:'ยีนส์',size:'M',color:'น้ำเงิน',price:590,cost:360,stock:6,img:'https://images.pexels.com/photos/1598507/pexels-photo-1598507.jpeg?auto=compress&cs=tinysrgb&w=400'},
    {id:'DRESS-FREE',barcode:'240001000105',name:'เดรสลายดอก',type:'เดรส',cat:'เดรส',size:'Free Size',color:'ครีม',price:490,cost:290,stock:7,img:'https://images.pexels.com/photos/1488463/pexels-photo-1488463.jpeg?auto=compress&cs=tinysrgb&w=400'}
  ],
  bills:[],returns:[],held:[]
};
let db=loadDB(),cart=[],selectedCat='ทั้งหมด',discountType='percent',payment='cash',lastBill=null,currentBarcodeProduct=null,html5QrCode=null,scannerRunning=false;

function loadDB(){try{return JSON.parse(localStorage.getItem(KEY))||structuredClone(defaultDB)}catch{return structuredClone(defaultDB)}}
function saveDB(){localStorage.setItem(KEY,JSON.stringify(db))}
function money(n){return (Number(n)||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2})+' บาท'}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2200)}
function today(){return new Date().toISOString().slice(0,10)}
function icon(){if(window.lucide)lucide.createIcons()}
document.addEventListener('DOMContentLoaded',init);

function init(){
  icon(); bind(); tick(); setInterval(tick,1000);
  renderCats(); renderProducts(); renderCart(); renderPages();
}
function bind(){
  document.querySelectorAll('.nav-btn').forEach(b=>b.addEventListener('click',()=>switchPage(b.dataset.page)));
  searchInput.addEventListener('input',renderProducts);
  searchInput.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();scanCode(searchInput.value)}});
  discountValue.addEventListener('input',renderCart);
  cashReceived.addEventListener('input',renderCart);
}
function tick(){
  datetime.textContent=new Date().toLocaleString('th-TH',{dateStyle:'medium',timeStyle:'medium'});
  const total=db.bills.filter(b=>!b.voided&&b.createdAt.slice(0,10)===today()).reduce((s,b)=>s+b.netTotal,0);
  todaySales.textContent=money(total);
}
function openDrawer(){sidebar.classList.add('open');drawerBack.classList.add('open');document.body.style.overflow='hidden'}
function closeDrawer(){sidebar.classList.remove('open');drawerBack.classList.remove('open');document.body.style.overflow=''}
function switchPage(page){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+page).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b=>{b.classList.remove('side-active');b.classList.add('text-gray-600')});
  const btn=document.querySelector(`.nav-btn[data-page="${page}"]`);
  if(btn){btn.classList.add('side-active');btn.classList.remove('text-gray-600')}
  closeDrawer(); closeCart(); renderPages(); icon();
}
function openCart(){cartPanel.classList.add('open');document.body.style.overflow='hidden'}
function closeCart(){cartPanel.classList.remove('open');if(!sidebar.classList.contains('open'))document.body.style.overflow=''}
function focusScanner(){searchInput.focus()}

function cats(){return ['ทั้งหมด',...new Set(db.products.map(p=>p.cat||'ทั่วไป'))]}
function renderCats(){
  catFilters.innerHTML=cats().map(c=>`<button onclick="setCat('${c}')" class="px-4 py-2 rounded-xl whitespace-nowrap font-semibold ${selectedCat===c?'bg-primary text-white':'bg-white soft-border text-gray-600'}">${c}</button>`).join('');
}
function setCat(c){selectedCat=c;renderCats();renderProducts()}
function filteredProducts(){
  const q=searchInput.value.trim().toLowerCase();
  return db.products.filter(p=>{
    const cat=selectedCat==='ทั้งหมด'||p.cat===selectedCat;
    const text=[p.id,p.barcode,p.name,p.type,p.cat,p.size,p.color].join(' ').toLowerCase();
    return cat&&(!q||text.includes(q));
  });
}
function renderProducts(){
  const list=filteredProducts();
  productGrid.innerHTML=list.map(p=>`
    <button onclick="addToCart('${p.id}')" class="bg-white rounded-3xl shadow-card p-3 text-left active:scale-[.98] ${p.stock<=0?'opacity-50 pointer-events-none':''}">

function addToCart(id){
  const p=db.products.find(x=>x.id===id); if(!p)return;

  if(qty+1>p.stock)return toast('สินค้าไม่พอ');
  if(ex)ex.qty++;else cart.push({id:p.id,name:p.name,type:p.type,cat:p.cat,size:p.size,color:p.color,barcode:p.barcode,price:p.price,cost:p.cost||0,qty:1});
  renderCart();
}
function scanCode(code){
  code=String(code||'').trim().toLowerCase(); if(!code)return;
  const p=db.products.find(x=>String(x.barcode||'').toLowerCase()===code||String(x.id).toLowerCase()===code);

}
function renderCart(){

function chgQty(idx,d){const it=cart[idx],p=db.products.find(x=>x.id===it.id);if(d>0&&it.qty+1>p.stock)return toast('สินค้าไม่พอ');it.qty+=d;if(it.qty<=0)cart.splice(idx,1);renderCart()}

function subTotal(){return cart.reduce((s,i)=>s+i.price*i.qty,0)}
function discAmt(){const v=Number(discountValue.value)||0,sub=subTotal();return Math.min(sub,discountType==='percent'?sub*v/100:v)}
function updateSummary(){const sub=subTotal(),disc=discAmt(),net=Math.max(0,sub-disc),cash=Number(cashReceived.value)||0;subtotalText.textContent=money(sub);discountText.textContent='-'+money(disc);netText.textContent=money(net);changeText.textContent=money(Math.max(0,cash-net))}
function checkout(){
  if(!cart.length)return toast('ยังไม่มีสินค้า');
  const sub=subTotal(),disc=discAmt(),net=Math.max(0,sub-disc),cash=Number(cashReceived.value)||0;
  if(payment==='cash'&&cash<net)return toast('รับเงินไม่พอ');
  const billNo='INV-'+today().replaceAll('-','')+'-'+String(db.bills.length+1).padStart(4,'0');
  const bill={billNo,items:cart.map(x=>({...x})),subtotal:sub,discount:disc,netTotal:net,paymentMethod:payment,paymentText:payment==='cash'?'เงินสด':payment==='transfer'?'โอนเงิน':otherType.value,otherDetail:payment==='other'?otherDetail.value:'',cashReceived:payment==='cash'?cash:net,change:payment==='cash'?Math.max(0,cash-net):0,cashier:db.settings.cashier,createdAt:new Date().toISOString(),voided:false};
  bill.items.forEach(i=>{const p=db.products.find(x=>x.id===i.id);if(p)p.stock-=i.qty});
  db.bills.push(bill);saveDB();lastBill=bill;cart=[];discountValue.value='';cashReceived.value='';renderProducts();renderCart();renderPages();tick();closeCart();successBill.textContent=billNo+' | '+money(net);successModal.classList.remove('hidden');icon();
}

function genCode(){const base=(pName.value||'ITEM').replace(/\s+/g,'').slice(0,6).toUpperCase()+'-'+(pColor.value||'C').slice(0,3).toUpperCase()+'-'+(pSize.value||'S').slice(0,4).toUpperCase();let id=base,n=1;while(db.products.some(p=>p.id===id))id=base+'-'+n++;pId.value=id}

function showBarcode(id){const p=db.products.find(x=>x.id===id);currentBarcodeProduct=p;barcodeContent.innerHTML=p.barcode?`<p class="font-bold">${p.name}</p><p class="text-sm text-gray-500">${p.size}/${p.color}</p><svg id="barSvg"></svg><p class="font-mono text-sm">${p.barcode}</p>`:'<p class="text-gray-400">ไม่มีบาร์โค้ด</p>';barcodeModal.classList.remove('hidden');setTimeout(()=>{if(p.barcode&&window.JsBarcode)JsBarcode('#barSvg',p.barcode,{format:'CODE128',width:2,height:60,displayValue:true})},80)}
function closeBarcodeModal(){barcodeModal.classList.add('hidden')}
function labelHTML(p,qty=1){return Array.from({length:qty}).map(()=>`<div class="barcode-label"><b>${p.name}</b><div style="font-size:11px">${p.size}/${p.color}</div>${p.barcode?`<svg class="printBarcode" data-code="${p.barcode}"></svg><div style="font-size:11px">${p.barcode}</div>`:'ไม่มีบาร์โค้ด'}<b>${money(p.price)}</b></div>`).join('')}
function renderPrintBars(){document.querySelectorAll('.printBarcode').forEach(s=>JsBarcode(s,s.dataset.code,{format:'CODE128',width:1.6,height:42,displayValue:false,margin:4}))}
function printCurrentBarcode(){if(!currentBarcodeProduct?.barcode)return toast('ไม่มีบาร์โค้ด');printArea.innerHTML=labelHTML(currentBarcodeProduct,1);setTimeout(()=>{renderPrintBars();window.print();setTimeout(()=>printArea.innerHTML='',300)},100)}
function printAllBarcodes(){const list=db.products.filter(p=>p.barcode);if(!list.length)return toast('ไม่มีบาร์โค้ด');printArea.innerHTML=list.map(p=>labelHTML(p,Math.max(1,p.stock||1))).join('');setTimeout(()=>{renderPrintBars();window.print();setTimeout(()=>printArea.innerHTML='',300)},100)}

async function openCameraScanner(){
  scannerModal.classList.remove('hidden');
  scanStatus.textContent='กำลังเปิดกล้อง...';
  icon();

  if(!window.isSecureContext && location.protocol !== 'file:'){
    scanStatus.textContent='กล้องต้องเปิดผ่าน HTTPS หรือ localhost';
    return;
  }
  if(!window.Html5Qrcode){
    scanStatus.textContent='โหลดระบบกล้องไม่ได้';
    return;
  }

  try{
    document.getElementById('reader').innerHTML = '';
    html5QrCode = new Html5Qrcode('reader');

    const formats = [];
    if(window.Html5QrcodeSupportedFormats){
      formats.push(
        Html5QrcodeSupportedFormats.CODE_128,
        Html5QrcodeSupportedFormats.CODE_39,
        Html5QrcodeSupportedFormats.EAN_13,
        Html5QrcodeSupportedFormats.EAN_8,
        Html5QrcodeSupportedFormats.UPC_A,
        Html5QrcodeSupportedFormats.UPC_E,
        Html5QrcodeSupportedFormats.QR_CODE
      );
    }

    const config = {
      fps: 15,
      qrbox: function(viewfinderWidth, viewfinderHeight) {
        const width = Math.floor(viewfinderWidth * 0.88);
        const height = Math.min(170, Math.floor(viewfinderHeight * 0.36));
        return { width, height };
      },
      aspectRatio: 1.777,
      rememberLastUsedCamera: true,
      supportedScanTypes: [Html5QrcodeScanType.SCAN_TYPE_CAMERA],
      formatsToSupport: formats
    };

    scannerRunning = true;

    await html5QrCode.start(
      { facingMode: { ideal: 'environment' } },
      config,
      async (decodedText) => {
        scanStatus.textContent='พบรหัส: '+decodedText;
        scanCode(decodedText);
        await closeCameraScanner();
      },
      () => {}
    );

    scanStatus.textContent='กำลังสแกนบาร์โค้ด... วางบาร์โค้ดให้อยู่กลางกรอบ';
  }catch(e){
    console.error(e);
    scanStatus.textContent='เปิดกล้องไม่ได้ หรือเบราว์เซอร์ไม่รองรับการอ่านบาร์โค้ดนี้';
  }
}
async function closeCameraScanner(){scannerModal.classList.add('hidden');if(html5QrCode&&scannerRunning){try{await html5QrCode.stop()}catch{}scannerRunning=false}}
</script>
</body>
