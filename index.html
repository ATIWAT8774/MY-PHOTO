<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Pre-order | ศาลเจ้าปึงเฒ่ากงชายทะเลบางสะพาน</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
  --pink:#d85b82;
  --pink-dark:#b94068;
  --pink-light:#fff1f5;
  --pink-soft:#ffe2ea;
  --text:#30252a;
  --muted:#88777e;
  --border:#eadde2;
  --white:#fff;
  --bg:#fffafb;

  --radius:20px;
  --shadow:0 12px 35px rgba(100,45,65,.09);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  font-family:"Noto Sans Thai",sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,
input,
textarea{
  font-family:inherit;
}

button{
  cursor:pointer;
}

a{
  text-decoration:none;
  color:inherit;
}


/* =====================================================
   APP
===================================================== */

#app{
  width:100%;
  height:100dvh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}


/* =====================================================
   HEADER
===================================================== */

.header{
  height:72px;
  min-height:72px;
  padding:
    0
    max(18px,env(safe-area-inset-right))
    0
    max(18px,env(safe-area-inset-left));

  display:flex;
  align-items:center;
  justify-content:space-between;

  background:rgba(255,255,255,.92);
  border-bottom:1px solid var(--border);

  backdrop-filter:blur(15px);
  z-index:20;
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
}

.logo{
  width:40px;
  height:40px;
  border-radius:13px;

  display:grid;
  place-items:center;

  background:linear-gradient(
    135deg,
    var(--pink),
    var(--pink-dark)
  );

  color:white;
  font-weight:800;
  font-size:18px;

  box-shadow:0 8px 20px rgba(216,91,130,.22);
}

.brand-text{
  display:flex;
  flex-direction:column;
  line-height:1.25;
}

.brand-text strong{
  font-size:14px;
  font-weight:800;
}

.brand-text span{
  font-size:10px;
  color:var(--muted);
}

.header-actions{
  display:flex;
  gap:8px;
}

.icon-button{
  width:40px;
  height:40px;

  border:1px solid var(--border);
  background:white;
  color:var(--pink);

  border-radius:12px;

  display:grid;
  place-items:center;
}

.icon-button svg{
  width:19px;
  height:19px;
}


/* =====================================================
   CONTENT
===================================================== */

#screen{
  position:relative;
  flex:1;
  min-height:0;
  overflow:hidden;
}

.screen{
  width:100%;
  height:100%;
  overflow-y:auto;
  overflow-x:hidden;

  padding:
    28px
    max(24px,env(safe-area-inset-right))
    100px
    max(24px,env(safe-area-inset-left));

  animation:screenIn .22s ease;
}

@keyframes screenIn{
  from{
    opacity:0;
    transform:translateX(12px);
  }

  to{
    opacity:1;
    transform:translateX(0);
  }
}

.screen-inner{
  width:min(100%,960px);
  min-height:100%;
  margin:auto;
}


/* =====================================================
   TYPOGRAPHY
===================================================== */

.eyebrow{
  color:var(--pink);
  font-size:11px;
  font-weight:800;
  letter-spacing:1.5px;
  margin-bottom:10px;
}

.title{
  font-size:clamp(28px,4vw,42px);
  line-height:1.2;
  font-weight:800;
}

.subtitle{
  color:var(--muted);
  font-size:14px;
  margin-top:10px;
  line-height:1.7;
}


/* =====================================================
   HOME
===================================================== */

.home{
  min-height:100%;
  display:grid;
  grid-template-columns:1fr 1fr;
  align-items:center;
  gap:60px;
}

.home-copy{
  position:relative;
}

.home-copy h1{
  font-size:clamp(40px,5vw,65px);
  line-height:1.12;
  font-weight:800;
  margin-bottom:20px;
}

.home-copy h1 span{
  color:var(--pink);
}

.home-copy p{
  color:var(--muted);
  font-size:15px;
  max-width:480px;
  margin-bottom:28px;
}

.price{
  margin-bottom:25px;
}

.price small{
  display:block;
  color:var(--muted);
  font-size:12px;
}

.price strong{
  color:var(--pink);
  font-size:34px;
}

.home-product{
  display:flex;
  justify-content:center;
  align-items:center;
}

.shirt{
  position:relative;
  width:min(390px,80%);
  aspect-ratio:1/1;

  border-radius:35% 35% 43% 43%;

  background:
    linear-gradient(
      145deg,
      #fff,
      #f0e9ec
    );

  box-shadow:
    0 35px 65px rgba(80,40,52,.13);

  display:flex;
  align-items:center;
  justify-content:center;

  color:#aaa;
  font-size:12px;
  letter-spacing:2px;
}

.shirt:before{
  content:"";
  position:absolute;

  width:100px;
  height:65px;

  top:-4px;
  left:50%;

  transform:translateX(-50%);

  border-radius:0 0 50px 50px;

  background:#e6dfe2;
}

.lotus-decoration{
  position:absolute;
  pointer-events:none;
  opacity:.07;
  color:var(--pink);
}

.lotus-decoration svg{
  width:100%;
  height:100%;
  fill:currentColor;
}

.lotus-1{
  width:330px;
  height:330px;
  right:0;
  top:0;
}

.lotus-2{
  width:190px;
  height:190px;
  left:-30px;
  bottom:20px;
  transform:rotate(15deg);
}


/* =====================================================
   BUTTON
===================================================== */

.primary{
  width:100%;
  min-height:52px;

  border:0;
  border-radius:15px;

  background:var(--pink);
  color:white;

  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;

  font-size:14px;
  font-weight:800;

  transition:.2s;
}

.primary:hover{
  background:var(--pink-dark);
}

.primary svg{
  width:18px;
  height:18px;
}

.secondary{
  width:100%;
  min-height:52px;

  border:1px solid var(--border);
  border-radius:15px;

  background:white;
  color:var(--text);

  font-weight:700;
}

.text-button{
  border:0;
  background:none;
  color:var(--pink);

  font-size:13px;
  font-weight:700;
}


/* =====================================================
   BOTTOM ACTION
===================================================== */

.bottom-action{
  position:fixed;
  left:0;
  right:0;
  bottom:0;

  padding:
    12px
    max(20px,env(safe-area-inset-right))
    max(12px,env(safe-area-inset-bottom))
    max(20px,env(safe-area-inset-left));

  background:rgba(255,255,255,.94);
  border-top:1px solid var(--border);

  backdrop-filter:blur(15px);

  z-index:30;
}

.bottom-action-inner{
  width:min(100%,960px);
  margin:auto;

  display:flex;
  gap:10px;
}

.bottom-action .back{
  width:52px;
  min-width:52px;

  border:1px solid var(--border);
  background:white;
  border-radius:15px;

  display:grid;
  place-items:center;
}

.bottom-action .back svg{
  width:20px;
  height:20px;
}

.bottom-action .primary{
  flex:1;
}


/* =====================================================
   PRODUCT SCREEN
===================================================== */

.product-layout{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:50px;
  align-items:center;

  min-height:calc(100% - 10px);
}

.product-photo{
  min-height:450px;

  border:1px solid var(--border);
  border-radius:28px;

  background:
    radial-gradient(
      circle,
      #fff 0,
      #fff1f5 75%
    );

  display:grid;
  place-items:center;
}

.product-photo .shirt{
  width:70%;
}

.product-info h2{
  font-size:30px;
  margin-bottom:10px;
}

.product-info p{
  color:var(--muted);
  font-size:14px;
  margin-bottom:25px;
}

.tags{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:25px;
}

.tag{
  padding:7px 11px;
  border-radius:999px;
  background:var(--pink-light);
  color:var(--pink);
  font-size:11px;
  font-weight:700;
}


/* =====================================================
   SIZE
===================================================== */

.size-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-top:28px;
}

.size-card{
  position:relative;

  border:1px solid var(--border);
  background:white;

  border-radius:17px;
  padding:18px;

  transition:.2s;
}

.size-card.active{
  border-color:var(--pink);
  background:var(--pink-light);

  box-shadow:
    0 0 0 3px rgba(216,91,130,.08);
}

.size-card strong{
  display:block;
  font-size:18px;
}

.size-card span{
  display:block;
  color:var(--muted);
  font-size:10px;
  margin-top:3px;
}

.quantity{
  display:flex;
  align-items:center;
  justify-content:space-between;

  margin-top:14px;

  background:#fff;
  border:1px solid var(--border);
  border-radius:10px;

  padding:3px;
}

.quantity button{
  width:28px;
  height:28px;

  border:0;
  border-radius:8px;

  background:var(--pink-light);
  color:var(--pink);

  font-size:18px;
}

.quantity span{
  min-width:24px;
  text-align:center;
  font-size:13px;
  color:var(--text);
  font-weight:800;
}


/* =====================================================
   SIZE TABLE
===================================================== */

.table-wrap{
  margin-top:28px;

  border:1px solid var(--border);
  border-radius:18px;

  overflow:hidden;
}

.table-scroll{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:450px;
}

th,
td{
  padding:13px 15px;
  text-align:center;
  border-bottom:1px solid #f2e9ed;
  font-size:12px;
}

th{
  color:var(--pink);
  background:#fff7f9;
  font-weight:800;
}


/* =====================================================
   FORM
===================================================== */

.form-container{
  width:min(100%,650px);
  margin:auto;
}

.form-card{
  margin-top:28px;

  padding:24px;

  border:1px solid var(--border);
  background:white;
  border-radius:20px;

  box-shadow:var(--shadow);
}

.form-group{
  margin-bottom:18px;
}

.form-group label{
  display:block;
  margin-bottom:7px;

  font-size:12px;
  font-weight:700;
}

.input{
  width:100%;
  height:50px;

  padding:0 15px;

  border:1px solid var(--border);
  border-radius:13px;

  outline:none;

  font-size:14px;
  color:var(--text);

  background:white;
}

.input:focus{
  border-color:var(--pink);

  box-shadow:
    0 0 0 4px rgba(216,91,130,.08);
}

textarea.input{
  height:110px;
  padding-top:13px;
  resize:none;
}


/* =====================================================
   DELIVERY
===================================================== */

.delivery-options{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;

  margin-top:30px;
}

.delivery-option{
  border:1px solid var(--border);
  background:white;

  border-radius:18px;
  padding:22px;

  text-align:left;

  transition:.2s;
}

.delivery-option.active{
  border-color:var(--pink);
  background:var(--pink-light);
}

.delivery-option svg{
  width:27px;
  height:27px;
  color:var(--pink);
  margin-bottom:14px;
}

.delivery-option strong{
  display:block;
  font-size:15px;
}

.delivery-option span{
  color:var(--muted);
  font-size:11px;
}


/* =====================================================
   SUMMARY
===================================================== */

.summary-card{
  width:min(100%,650px);
  margin:28px auto 0;

  background:white;
  border:1px solid var(--border);

  border-radius:20px;
  padding:23px;
}

.summary-row{
  display:flex;
  justify-content:space-between;
  gap:15px;

  padding:12px 0;

  border-bottom:1px solid #f1e8eb;

  font-size:13px;
}

.summary-row span{
  color:var(--muted);
}

.summary-total{
  display:flex;
  justify-content:space-between;
  align-items:end;

  padding-top:18px;
}

.summary-total span{
  font-size:12px;
  color:var(--muted);
}

.summary-total strong{
  color:var(--pink);
  font-size:28px;
}


/* =====================================================
   PAYMENT
===================================================== */

.payment-box{
  width:min(100%,550px);
  margin:28px auto 0;

  background:white;
  border:1px solid var(--border);

  border-radius:22px;
  padding:25px;

  text-align:center;
}

.qr{
  width:220px;
  aspect-ratio:1;

  margin:20px auto;

  border-radius:15px;

  background:
    repeating-linear-gradient(
      45deg,
      #222 0 3px,
      #fff 3px 7px
    );

  border:12px solid white;

  box-shadow:0 5px 25px rgba(0,0,0,.1);
}

.upload{
  border:1.5px dashed var(--pink);
  background:var(--pink-light);

  border-radius:15px;

  padding:22px;

  cursor:pointer;
}

.upload input{
  display:none;
}

.upload strong{
  display:block;
  color:var(--pink);
  font-size:13px;
}

.upload span{
  display:block;
  color:var(--muted);
  font-size:10px;
  margin-top:4px;
}


/* =====================================================
   SUCCESS
===================================================== */

.success{
  height:100%;
  display:grid;
  place-items:center;
  text-align:center;
}

.success-box{
  width:min(100%,500px);
}

.success-icon{
  width:75px;
  height:75px;

  margin:0 auto 22px;

  border-radius:50%;

  background:var(--pink-light);
  color:var(--pink);

  display:grid;
  place-items:center;
}

.success-icon svg{
  width:34px;
  height:34px;
}

.order-number{
  margin:25px 0;

  padding:18px;

  background:var(--pink-light);
  border-radius:16px;
}

.order-number small{
  display:block;
  color:var(--muted);
  font-size:11px;
}

.order-number strong{
  display:block;
  color:var(--pink);
  font-size:24px;
  letter-spacing:1px;
}


/* =====================================================
   TRACKING
===================================================== */

.tracking{
  width:min(100%,650px);
  margin:auto;
}

.tracking-card{
  margin-top:30px;

  padding:25px;

  border:1px solid var(--border);
  border-radius:20px;

  background:white;

  box-shadow:var(--shadow);
}

.status{
  margin-top:25px;
  padding:20px;

  background:var(--pink-light);
  border-radius:15px;

  display:none;
}

.status strong{
  color:var(--pink);
  display:block;
}

.status span{
  font-size:12px;
  color:var(--muted);
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:760px){

  .header{
    height:64px;
    min-height:64px;
  }

  .logo{
    width:37px;
    height:37px;
  }

  .brand-text strong{
    font-size:13px;
  }

  .brand-text span{
    font-size:9px;
  }

  .screen{
    padding:
      22px
      max(18px,env(safe-area-inset-right))
      92px
      max(18px,env(safe-area-inset-left));
  }


  /* HOME */

  .home{
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:22px;

    text-align:center;
  }

  .home-copy{
    width:100%;
  }

  .home-copy h1{
    font-size:39px;
  }

  .home-copy p{
    font-size:13px;
    margin-inline:auto;
    margin-bottom:18px;
  }

  .home-product{
    order:-1;
    width:100%;
  }

  .shirt{
    width:220px;
  }

  .price{
    margin-bottom:17px;
  }

  .price strong{
    font-size:29px;
  }

  .lotus-1{
    width:230px;
    height:230px;
  }

  .lotus-2{
    display:none;
  }


  /* PRODUCT */

  .product-layout{
    display:flex;
    flex-direction:column;
    gap:25px;

    min-height:0;
  }

  .product-photo{
    width:100%;
    min-height:280px;
  }

  .product-photo .shirt{
    width:220px;
  }

  .product-info h2{
    font-size:25px;
  }


  /* SIZE */

  .size-grid{
    grid-template-columns:repeat(2,1fr);
    gap:10px;
  }

  .size-card{
    padding:14px;
  }


  /* DELIVERY */

  .delivery-options{
    grid-template-columns:1fr;
  }


  /* FORM */

  .form-card{
    padding:19px;
  }


  /* PAYMENT */

  .qr{
    width:190px;
  }


  /* TITLES */

  .title{
    font-size:28px;
  }

  .subtitle{
    font-size:13px;
  }

}


/* =====================================================
   VERY SMALL DEVICES
===================================================== */

@media(max-width:380px){

  .screen{
    padding-left:14px;
    padding-right:14px;
  }

  .home-copy h1{
    font-size:34px;
  }

  .shirt{
    width:185px;
  }

  .size-card{
    padding:12px;
  }

  .quantity button{
    width:26px;
    height:26px;
  }

}

</style>
</head>


<body>

<div id="app">

  <!-- HEADER -->
  <header class="header">

    <button
      class="icon-button"
      id="backButton"
      onclick="goBack()"
      aria-label="ย้อนกลับ"
      style="visibility:hidden"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5"/>
        <path d="m12 19-7-7 7-7"/>
      </svg>
    </button>


    <div class="brand">

      <div class="logo">
        ป
      </div>

      <div class="brand-text">
        <strong>ปึงเฒ่ากง</strong>
        <span>ชายทะเลบางสะพาน</span>
      </div>

    </div>


    <div class="header-actions">

      <button
        class="icon-button"
        onclick="showScreen('tracking')"
        aria-label="ตรวจสอบออเดอร์"
      >

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="11" cy="11" r="6"/>
          <path d="m16 16 4 4"/>
        </svg>

      </button>

    </div>

  </header>


  <!-- SCREEN -->
  <main id="screen"></main>


  <!-- BOTTOM ACTION -->
  <div
    class="bottom-action"
    id="bottomAction"
  >

    <div class="bottom-action-inner">

      <button
        class="back"
        onclick="goBack()"
        id="bottomBack"
      >

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5"/>
          <path d="m12 19-7-7 7-7"/>
        </svg>

      </button>

      <button
        class="primary"
        id="nextButton"
        onclick="nextStep()"
      >
        เริ่มสั่งซื้อ
      </button>

    </div>

  </div>

</div>


<script>

/* =====================================================
   DATA
===================================================== */

const PRICE = 300;

const sizes = {

  S:{
    chest:'38"',
    length:'26"',
    qty:0
  },

  M:{
    chest:'40"',
    length:'27"',
    qty:0
  },

  L:{
    chest:'42"',
    length:'28"',
    qty:0
  },

  XL:{
    chest:'44"',
    length:'29"',
    qty:0
  },

  '2XL':{
    chest:'46"',
    length:'30"',
    qty:0
  },

  '3XL':{
    chest:'48"',
    length:'31"',
    qty:0
  }

};


const order = {

  customer:{
    name:'',
    phone:'',
    line:''
  },

  delivery:{
    type:'',
    address:''
  }

};


/* =====================================================
   SCREEN SYSTEM
===================================================== */

let currentScreen = 'home';

let historyStack = [];


function showScreen(screen){

  if(currentScreen !== screen){

    historyStack.push(currentScreen);

  }

  currentScreen = screen;

  render();

}


function goBack(){

  if(historyStack.length === 0){

    return;

  }

  currentScreen =
    historyStack.pop();

  render();

}


function render(){

  const screen =
    document.getElementById('screen');

  screen.innerHTML =
    screenTemplate(currentScreen);

  updateNavigation();

  screen.scrollTop = 0;

}


function updateNavigation(){

  const back =
    document.getElementById('backButton');

  const bottomBack =
    document.getElementById('bottomBack');

  const bottomAction =
    document.getElementById('bottomAction');

  const next =
    document.getElementById('nextButton');


  const home =
    currentScreen === 'home';

  const tracking =
    currentScreen === 'tracking';

  const success =
    currentScreen === 'success';


  back.style.visibility =
    home ? 'hidden' : 'visible';


  bottomBack.style.display =
    home || success || tracking
      ? 'none'
      : 'grid';


  bottomAction.style.display =
    success || tracking
      ? 'none'
      : 'block';


  if(currentScreen === 'home'){

    next.textContent =
      'ดูรายละเอียดและสั่งซื้อ';

  }

  else if(currentScreen === 'product'){

    next.textContent =
      'เลือกไซซ์';

  }

  else if(currentScreen === 'size'){

    next.textContent =
      'ดำเนินการต่อ';

  }

  else if(currentScreen === 'customer'){

    next.textContent =
      'เลือกวิธีรับสินค้า';

  }

  else if(currentScreen === 'delivery'){

    next.textContent =
      'ตรวจสอบรายการ';

  }

  else if(currentScreen === 'summary'){

    next.textContent =
      'ไปชำระเงิน';

  }

  else if(currentScreen === 'payment'){

    next.textContent =
      'ยืนยันการชำระเงิน';

  }

}


/* =====================================================
   SCREEN TEMPLATES
===================================================== */

function screenTemplate(screen){

  switch(screen){

    case 'home':
      return homeScreen();

    case 'product':
      return productScreen();

    case 'size':
      return sizeScreen();

    case 'customer':
      return customerScreen();

    case 'delivery':
      return deliveryScreen();

    case 'summary':
      return summaryScreen();

    case 'payment':
      return paymentScreen();

    case 'success':
      return successScreen();

    case 'tracking':
      return trackingScreen();

    default:
      return homeScreen();

  }

}

/* =====================================================
   FUNCTIONS
===================================================== */

function totalQty(){

return Object.values(sizes)
.reduce(
(sum,item)=>sum + item.qty,
0
);

}


function changeQty(size,amount){

sizes[size].qty =
Math.max(
0,
sizes[size].qty + amount
);

render();

}


function selectDelivery(type){

order.delivery.type =
type;

render();

}


function saveCustomer(){

const name =
document.getElementById('customerName');

const phone =
document.getElementById('customerPhone');

const line =
document.getElementById('customerLine');

if(!name.value.trim()){

alert('กรุณากรอกชื่อ - นามสกุล');

return false;

}

if(!phone.value.trim()){

alert('กรุณากรอกเบอร์โทรศัพท์');

return false;

}

order.customer.name =
name.value.trim();

order.customer.phone =
phone.value.trim();

order.customer.line =
line.value.trim();

return true;

}


function saveDelivery(){

if(!order.delivery.type){

alert('กรุณาเลือกวิธีรับสินค้า');

return false;

}


if(order.delivery.type === 'delivery'){

const address =
document.getElementById('deliveryAddress');

if(!address || !address.value.trim()){

alert('กรุณากรอกที่อยู่สำหรับจัดส่ง');

return false;

}

order.delivery.address =
address.value.trim();

}

return true;

}


function nextStep(){

switch(currentScreen){

case 'home':

showScreen('product');

break;


case 'product':

showScreen('size');

break;


case 'size':

if(totalQty() === 0){

alert(
'กรุณาเลือกไซซ์และจำนวนเสื้อ'
);

return;

}

showScreen('customer');

break;


case 'customer':

if(!saveCustomer()) return;

showScreen('delivery');

break;


case 'delivery':

if(!saveDelivery()) return;

showScreen('summary');

break;


case 'summary':

showScreen('payment');

break;


case 'payment':

showScreen('success');

break;

}

}


function showFile(input){

const name =
document.getElementById('fileName');

if(input.files.length){

name.textContent =
input.files[0].name;

}

}


function trackOrder(){

const orderNumber =
document.getElementById('trackOrder').value.trim();

const phone =
document.getElementById('trackPhone').value.trim();

if(!orderNumber || !phone){

alert(
'กรุณากรอกข้อมูลให้ครบ'
);

return;

}

const status =
document.getElementById('trackingStatus');

status.style.display =
'block';

}


function escapeHTML(value){

return String(value ?? '')
.replace(/&/g,'&amp;')
.replace(/</g,'&lt;')
.replace(/>/g,'&gt;')
.replace(/"/g,'&quot;')
.replace(/'/g,'&#039;');

}


/* =====================================================
   START
===================================================== */

render();

</script>
