<!doctype html>
<html lang="th" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ส่งใจถึงครู + กาชาการ์ดครู</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{font-family:'Prompt',sans-serif;box-sizing:border-box} body{margin:0}
    .petal{position:absolute;width:12px;height:12px;background:rgba(255,182,193,.55);border-radius:50% 0 50% 0;animation:petalFall 5s linear infinite}
    @keyframes petalFall{0%{transform:translateY(-20px) rotate(0deg);opacity:1}100%{transform:translateY(140px) rotate(360deg);opacity:0}}
    .rarity-N{border-color:#9ca3af}.rarity-R{border-color:#60a5fa}.rarity-SR{border-color:#a78bfa}.rarity-SSR{border-color:#fbbf24;box-shadow:0 0 26px rgba(251,191,36,.55)}
    .shimmer{background:linear-gradient(90deg,transparent 30%,rgba(255,215,0,.45) 50%,transparent 70%);background-size:200% 100%;animation:shimmer 2s infinite}@keyframes shimmer{0%{background-position:-200% center}100%{background-position:200% center}}
    .gacha-machine{position:relative;overflow:hidden}.gacha-machine:before{content:"";position:absolute;inset:-35%;background:conic-gradient(from 0deg,transparent,#f9a8d4,transparent,#fde68a,transparent);animation:spin 1.2s linear infinite;opacity:.45}@keyframes spin{to{transform:rotate(360deg)}}
    .spark-pop{animation:shake .9s ease-in-out}@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-7deg) scale(1.03)}40%{transform:rotate(7deg) scale(1.05)}60%{transform:rotate(-5deg) scale(1.04)}80%{transform:rotate(5deg) scale(1.02)}}
    .card-reveal{animation:reveal .55s ease-out}@keyframes reveal{0%{transform:scale(.35) rotateY(90deg);opacity:0}70%{transform:scale(1.08) rotateY(0);opacity:1}100%{transform:scale(1)}}
    .ssr-burst{animation:reveal .55s ease-out, ssrGlow 1.3s ease-in-out infinite alternate}@keyframes ssrGlow{from{filter:drop-shadow(0 0 4px #fbbf24)}to{filter:drop-shadow(0 0 22px #f59e0b)}}
    .nav-btn.active{background:#ec4899;color:white;box-shadow:0 6px 14px rgba(236,72,153,.24);border-color:#ec4899}
  </style>
</head>
<body class="h-full">
<div id="app" class="min-h-full w-full overflow-auto" style="background:linear-gradient(135deg,#FFF0F5 0%,#FFE4E1 35%,#FFF5EE 70%,#FFFAF0 100%)">
  <div class="fixed inset-0 pointer-events-none overflow-hidden" style="z-index:0">
    <div class="petal" style="left:10%;animation-delay:0s"></div><div class="petal" style="left:25%;animation-delay:1s"></div><div class="petal" style="left:50%;animation-delay:2s"></div><div class="petal" style="left:75%;animation-delay:.5s"></div><div class="petal" style="left:90%;animation-delay:1.5s"></div>
  </div>
  <main class="relative z-10 max-w-lg mx-auto px-4 py-6">
    <header class="text-center mb-6">
      <div class="inline-flex items-center gap-2 mb-2"><i data-lucide="heart" class="w-6 h-6 text-pink-400"></i><i data-lucide="sparkles" class="w-5 h-5 text-yellow-400"></i></div>
      <h1 class="text-3xl font-bold text-pink-600 mb-2">ส่งใจถึงครู</h1>
      <p class="text-sm text-pink-400 font-light">ฝากข้อความถึงคุณครู และสะสมการ์ดกาชาวันไหว้ครู</p>
      <p id="login-chip" class="hidden mt-3 text-xs bg-white/80 border border-pink-100 text-pink-500 rounded-full px-3 py-1 inline-block"></p>
    </header>

    <nav class="flex gap-2 mb-6 overflow-x-auto pb-2" id="nav-tabs">
      <button onclick="showSection('message')" class="nav-btn active flex items-center gap-1.5 px-4 py-2 rounded-full text-sm font-medium bg-white text-pink-500 border border-pink-200 whitespace-nowrap transition-all"><i data-lucide="message-circle" class="w-4 h-4"></i> ฝากข้อความ</button>
      <button onclick="showSection('gacha')" class="nav-btn flex items-center gap-1.5 px-4 py-2 rounded-full text-sm font-medium bg-white text-pink-500 border border-pink-200 whitespace-nowrap transition-all"><i data-lucide="gift" class="w-4 h-4"></i> สุ่มกาชา</button>
      <button onclick="showSection('collection')" class="nav-btn flex items-center gap-1.5 px-4 py-2 rounded-full text-sm font-medium bg-white text-pink-500 border border-pink-200 whitespace-nowrap transition-all"><i data-lucide="layout-grid" class="w-4 h-4"></i> การ์ดสะสม</button>
      <button onclick="showSection('login')" class="nav-btn flex items-center gap-1.5 px-4 py-2 rounded-full text-sm font-medium bg-white text-pink-500 border border-pink-200 whitespace-nowrap transition-all"><i data-lucide="lock" class="w-4 h-4"></i> หลังบ้าน</button>
    </nav>

    <section id="section-message" class="section-content">
      <div class="bg-white rounded-3xl shadow-lg p-6 border border-pink-100">
        <div class="flex items-center gap-2 mb-4"><i data-lucide="pen-tool" class="w-5 h-5 text-pink-400"></i><h2 class="text-lg font-semibold text-gray-800">ฝากข้อความถึงครู</h2></div>
        <label class="block text-sm text-gray-600 mb-1">เลือกครูที่ต้องการส่งข้อความ</label><select id="msg-teacher" class="w-full px-4 py-2.5 rounded-xl border border-pink-200 text-sm bg-pink-50/50 mb-4"></select>
        <label class="block text-sm text-gray-600 mb-1">ชื่อผู้ส่ง (ไม่ระบุก็ได้)</label><input id="msg-name" placeholder="นักเรียนผู้น่ารัก" class="w-full px-4 py-2.5 rounded-xl border border-pink-200 text-sm bg-pink-50/50 mb-4">
        <label class="block text-sm text-gray-600 mb-1">ข้อความถึงครู</label><textarea id="msg-text" rows="4" placeholder="เขียนข้อความรัก ๆ ถึงครูที่นี่..." class="w-full px-4 py-3 rounded-xl border border-pink-200 text-sm bg-pink-50/50 resize-none mb-4"></textarea>
        <button onclick="sendMessage()" class="w-full py-3 bg-gradient-to-r from-pink-400 to-pink-500 text-white rounded-xl font-medium shadow-md flex items-center justify-center gap-2"><i data-lucide="send" class="w-4 h-4"></i> ส่งข้อความ</button>
      </div>
    </section>

    <section id="section-gacha" class="section-content hidden">
      <div class="bg-white rounded-3xl shadow-lg p-6 border border-pink-100 text-center">
        <div class="flex items-center justify-center gap-2 mb-2"><i data-lucide="sparkles" class="w-5 h-5 text-yellow-400"></i><h2 class="text-lg font-semibold text-gray-800">สุ่มกาชาการ์ดครู</h2><i data-lucide="sparkles" class="w-5 h-5 text-yellow-400"></i></div>
        <p class="text-xs text-gray-500 mb-5">สุ่มการ์ดภาพจริง ถ้าซ้ำจะไม่เพิ่มเข้าคอลเลกชัน</p>
        <div id="gacha-stage" class="gacha-machine mx-auto mb-5 w-52 h-72 rounded-3xl bg-gradient-to-br from-pink-100 via-white to-yellow-50 border-2 border-pink-100 flex items-center justify-center shadow-inner"><div class="relative z-10 text-center text-pink-400"><i data-lucide="gift" class="w-12 h-12 mx-auto mb-2"></i><p class="text-xs">กดสุ่มเพื่อเปิดการ์ด</p></div></div>
        <div id="gacha-result" class="hidden mb-5"><div id="gacha-card" class="mx-auto w-52 rounded-2xl border-4 overflow-hidden bg-white shadow-xl card-reveal"><img id="gacha-image" class="w-full aspect-[4/5] object-cover bg-pink-50"><div class="p-3"><p id="gacha-rarity" class="text-xs font-bold mb-1"></p><p id="gacha-name" class="text-sm font-semibold text-gray-800"></p><p id="gacha-status" class="text-[11px] text-pink-500 mt-1"></p></div></div><button onclick="downloadCard()" class="mt-3 px-5 py-2 rounded-full bg-pink-50 text-pink-500 border border-pink-200 text-sm"><i data-lucide="download" class="w-4 h-4 inline"></i> บันทึกภาพการ์ดนี้</button></div>
        <button onclick="pullGacha()" id="gacha-btn" class="px-8 py-3 bg-gradient-to-r from-yellow-400 to-pink-400 text-white rounded-xl font-semibold shadow-lg hover:scale-105 transition-all"><i data-lucide="gift" class="w-5 h-5 inline mr-1"></i> สุ่มกาชา!</button>
      </div>
    </section>

    <section id="section-collection" class="section-content hidden"><div class="bg-white rounded-3xl shadow-lg p-6 border border-pink-100"><div class="flex items-center gap-2 mb-4"><i data-lucide="layout-grid" class="w-5 h-5 text-pink-400"></i><h2 class="text-lg font-semibold text-gray-800">คอลเลกชันการ์ด</h2></div><div id="collection-grid" class="grid grid-cols-3 gap-3"></div></div></section>

    <section id="section-login" class="section-content hidden">
      <div class="bg-white rounded-3xl shadow-lg p-6 border border-pink-100">
        <div class="flex items-center gap-2 mb-4"><i data-lucide="shield" class="w-5 h-5 text-pink-400"></i><h2 class="text-lg font-semibold text-gray-800">เข้าสู่ระบบหลังบ้าน</h2></div>
        <p class="text-xs text-gray-400 mb-4">บัญชีตัวอย่าง: super / admin / teacher รหัสผ่าน 1234</p>
        <input id="login-user" placeholder="username" class="w-full px-4 py-2.5 rounded-xl border border-pink-200 text-sm bg-pink-50/50 mb-3">
        <input id="login-pass" type="password" placeholder="password" class="w-full px-4 py-2.5 rounded-xl border border-pink-200 text-sm bg-pink-50/50 mb-4">
        <button onclick="login()" class="w-full py-3 bg-pink-500 text-white rounded-xl font-medium">เข้าสู่ระบบ</button>
      </div>
    </section>

    <section id="section-backoffice" class="section-content hidden">
      <div class="bg-white rounded-3xl shadow-lg p-6 border border-pink-100">
        <div class="flex justify-between items-center mb-4"><div><h2 class="text-lg font-semibold text-gray-800">หลังบ้าน</h2><p id="role-label" class="text-xs text-pink-400"></p></div><button onclick="logout()" class="text-xs px-3 py-1.5 rounded-full bg-gray-100 text-gray-500">ออก</button></div>
        <div id="admin-tabs" class="flex gap-2 overflow-x-auto pb-2 mb-4"></div>
        <div id="admin-content"></div>
      </div>
    </section>

    <footer class="text-center mt-8 mb-4 text-xs text-pink-300">กิจกรรมวันไหว้ครู 2568</footer>
  </main>
</div>
<script>
const teachers=[{id:'t1',name:'ครูสมศรี ใจดี',subject:'ภาษาไทย'},{id:'t2',name:'ครูประยุทธ์ วิชาดี',subject:'คณิตศาสตร์'},{id:'t3',name:'ครูมาลี รักเรียน',subject:'วิทยาศาสตร์'},{id:'t4',name:'ครูสมชาย ศิลป์สวย',subject:'ศิลปะ'},{id:'t5',name:'ครูวิภา อังกฤษเก่ง',subject:'ภาษาต่างประเทศ'},{id:'t6',name:'ครูธนพล กีฬาเด่น',subject:'สุขศึกษา'}];
const users=[{username:'super',password:'1234',name:'ผู้ดูแลระบบ',role:'super_admin'},{username:'admin',password:'1234',name:'แอดมิน',role:'admin'},{username:'teacher',password:'1234',name:'ครูสมศรี ใจดี',role:'teacher',teacherId:'t1'}];
let currentUser=JSON.parse(localStorage.getItem('current_user')||'null');
let messages=JSON.parse(localStorage.getItem('teacher_messages')||'[]');
let collection=JSON.parse(localStorage.getItem('gacha_collection')||'[]');
let gachaCards=JSON.parse(localStorage.getItem('gacha_cards')||'null')||[
{id:'card-t1-n',teacherId:'t1',name:'การ์ดครูสมศรี',rarity:'N',rate:50,imageUrl:'https://placehold.co/800x1000/FFF0F5/EC4899?text=Teacher+Card+N',active:true},
{id:'card-t2-r',teacherId:'t2',name:'การ์ดครูประยุทธ์',rarity:'R',rate:30,imageUrl:'https://placehold.co/800x1000/EFF6FF/3B82F6?text=Teacher+Card+R',active:true},
{id:'card-t3-sr',teacherId:'t3',name:'การ์ดครูมาลี',rarity:'SR',rate:15,imageUrl:'https://placehold.co/800x1000/F5F3FF/8B5CF6?text=Teacher+Card+SR',active:true},
{id:'card-t4-ssr',teacherId:'t4',name:'การ์ดครูสมชาย',rarity:'SSR',rate:5,imageUrl:'https://placehold.co/800x1000/FFFBEB/F59E0B?text=Teacher+Card+SSR',active:true}
];
let lastPulledCard=null;
function saveAll(){localStorage.setItem('teacher_messages',JSON.stringify(messages));localStorage.setItem('gacha_cards',JSON.stringify(gachaCards));localStorage.setItem('gacha_collection',JSON.stringify(collection));}
function init(){const sel=document.getElementById('msg-teacher');sel.innerHTML=teachers.map(t=>`<option value="${t.id}">${t.name} - ${t.subject}</option>`).join('');renderCollection();updateLoginChip();lucide.createIcons()}
function showSection(name){document.querySelectorAll('.section-content').forEach(s=>s.classList.add('hidden'));document.getElementById('section-'+name).classList.remove('hidden');document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));if(event?.currentTarget)event.currentTarget.classList.add('active');if(name==='backoffice')renderBackoffice()}
function gotoSection(name){document.querySelectorAll('.section-content').forEach(s=>s.classList.add('hidden'));document.getElementById('section-'+name).classList.remove('hidden');}
function sendMessage(){const teacherId=document.getElementById('msg-teacher').value;const senderName=document.getElementById('msg-name').value.trim()||'นักเรียนนิรนาม';const text=document.getElementById('msg-text').value.trim();if(!text)return showToast('กรุณาเขียนข้อความก่อนส่ง');messages.unshift({id:'msg-'+Date.now(),teacherId,senderName,text,status:'pending',readStatus:'unread',createdAt:new Date().toLocaleString('th-TH')});saveAll();document.getElementById('msg-text').value='';showToast('ส่งข้อความแล้ว รอแอดมินอนุมัติ')}
function pickCard(){const active=gachaCards.filter(c=>c.active);const total=active.reduce((s,c)=>s+Number(c.rate||0),0)||1;let roll=Math.random()*total;for(const c of active){roll-=Number(c.rate||0);if(roll<=0)return c}return active[0]}
function pullGacha(){const btn=document.getElementById('gacha-btn'),stage=document.getElementById('gacha-stage'),result=document.getElementById('gacha-result');btn.disabled=true;btn.innerHTML='กำลังสุ่ม...';result.classList.add('hidden');stage.classList.remove('hidden');stage.classList.add('spark-pop');setTimeout(()=>{const card=pickCard();lastPulledCard=card;const owned=collection.some(c=>c.id===card.id);if(!owned){collection.push(card);saveAll()}stage.classList.add('hidden');stage.classList.remove('spark-pop');showGachaCard(card,owned?'มีการ์ดนี้แล้ว เลยไม่เพิ่มซ้ำ':'ได้การ์ดใหม่! เพิ่มเข้าคอลเลกชันแล้ว');if(card.rarity==='SSR')showToast('SSR!!! ได้การ์ดระดับตำนาน ✨');else showToast(owned?'ได้ซ้ำ มีใบนี้แล้ว':'ได้การ์ดใหม่แล้ว!');renderCollection();btn.disabled=false;btn.innerHTML='<i data-lucide="gift" class="w-5 h-5 inline mr-1"></i> สุ่มกาชา!';lucide.createIcons()},900)}
function showGachaCard(card,status){document.getElementById('gacha-card').className=`mx-auto w-52 rounded-2xl border-4 overflow-hidden bg-white shadow-xl card-reveal rarity-${card.rarity} ${card.rarity==='SSR'?'ssr-burst':''}`;document.getElementById('gacha-image').src=card.imageUrl;document.getElementById('gacha-rarity').textContent=card.rarity;document.getElementById('gacha-rarity').className=`text-xs font-bold mb-1 ${card.rarity==='SSR'?'text-yellow-500':card.rarity==='SR'?'text-purple-500':card.rarity==='R'?'text-blue-500':'text-gray-500'}`;document.getElementById('gacha-name').textContent=card.name;document.getElementById('gacha-status').textContent=status;document.getElementById('gacha-result').classList.remove('hidden')}
async function downloadCard(){const el=document.getElementById('gacha-card');const canvas=await html2canvas(el,{useCORS:true});const a=document.createElement('a');a.download=(lastPulledCard?.name||'teacher-card')+'.png';a.href=canvas.toDataURL('image/png');a.click()}
function renderCollection(){const grid=document.getElementById('collection-grid');if(!collection.length){grid.innerHTML='<div class="text-center text-xs text-gray-400 col-span-3 py-8"><i data-lucide="inbox" class="w-8 h-8 mx-auto text-gray-300 mb-2"></i>ยังไม่มีการ์ดสะสม<br>ลองสุ่มกาชาดูสิ!</div>';return}grid.innerHTML=collection.map(c=>`<button onclick="previewCard('${c.id}')" class="rounded-xl border-2 rarity-${c.rarity} p-1 bg-gradient-to-b from-white to-pink-50 hover:scale-105 transition-transform"><img src="${c.imageUrl}" class="w-full aspect-[4/5] object-cover rounded-lg bg-pink-50 mb-1"><p class="text-[10px] font-bold">${c.rarity}</p><p class="text-[10px] text-gray-700 truncate">${c.name}</p></button>`).join('');lucide.createIcons()}
function previewCard(id){const card=collection.find(c=>c.id===id);if(!card)return;gotoSection('gacha');document.getElementById('gacha-stage').classList.add('hidden');showGachaCard(card,'การ์ดในคอลเลกชันของคุณ')}
function login(){const u=document.getElementById('login-user').value.trim();const p=document.getElementById('login-pass').value;const found=users.find(x=>x.username===u&&x.password===p);if(!found)return showToast('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');currentUser=found;localStorage.setItem('current_user',JSON.stringify(currentUser));updateLoginChip();gotoSection('backoffice');renderBackoffice();showToast('เข้าสู่ระบบแล้ว')}
function logout(){currentUser=null;localStorage.removeItem('current_user');updateLoginChip();gotoSection('login')}
function updateLoginChip(){const chip=document.getElementById('login-chip');if(currentUser){chip.classList.remove('hidden');chip.textContent=`ล็อกอิน: ${currentUser.name} (${roleName(currentUser.role)})`}else chip.classList.add('hidden')}
function roleName(r){return r==='super_admin'?'ผู้ดูแลระบบ':r==='admin'?'แอดมิน':'ครู'}
function renderBackoffice(){if(!currentUser){gotoSection('login');return}document.getElementById('role-label').textContent=`บทบาท: ${roleName(currentUser.role)}`;const tabs=[];if(currentUser.role==='super_admin')tabs.push(['users','จัดการผู้ใช้'],['cards','จัดการการ์ด/เรท'],['requests','คำขอข้อความ']);if(currentUser.role==='admin')tabs.push(['requests','คำขอข้อความ']);if(currentUser.role==='teacher')tabs.push(['teacher','หีบจดหมายครู']);document.getElementById('admin-tabs').innerHTML=tabs.map((t,i)=>`<button onclick="renderAdminPane('${t[0]}')" class="px-3 py-2 rounded-full text-xs ${i===0?'bg-pink-500 text-white':'bg-pink-50 text-pink-500'}">${t[1]}</button>`).join('');renderAdminPane(tabs[0][0])}
function renderAdminPane(type){if(type==='users')return renderUsers();if(type==='cards')return renderCards();if(type==='requests')return renderRequests();if(type==='teacher')return renderTeacherMailbox()}
function renderUsers(){document.getElementById('admin-content').innerHTML=`<div class="space-y-3">${users.map(u=>`<div class="p-3 rounded-2xl bg-pink-50/60 border border-pink-100"><p class="font-medium text-gray-700">${u.name}</p><p class="text-xs text-gray-400">${u.username} • ${roleName(u.role)} ${u.teacherId?'• '+u.teacherId:''}</p></div>`).join('')}<p class="text-xs text-gray-400">* ไฟล์เดี่ยวนี้เป็นระบบจำลอง ถ้าต่อ Firebase จริงจะสร้าง/แก้ผู้ใช้ผ่าน Auth + Firestore</p></div>`}
function renderCards(){document.getElementById('admin-content').innerHTML=`<div class="space-y-3">${gachaCards.map(c=>`<div class="p-3 rounded-2xl border border-pink-100 bg-white"><div class="flex gap-3"><img src="${c.imageUrl}" class="w-16 h-20 object-cover rounded-lg border"><div class="flex-1"><p class="font-medium text-gray-700">${c.name}</p><p class="text-xs text-gray-400">${c.rarity} • ${teachers.find(t=>t.id===c.teacherId)?.name||'-'}</p><label class="text-xs text-gray-500">เรท</label><input type="number" value="${c.rate}" onchange="updateRate('${c.id}',this.value)" class="w-full mt-1 px-3 py-2 rounded-xl border border-pink-100 text-sm"><label class="text-xs"><input type="checkbox" ${c.active?'checked':''} onchange="toggleCard('${c.id}',this.checked)"> เปิดใช้งาน</label></div></div></div>`).join('')}</div>`}
function updateRate(id,value){const c=gachaCards.find(x=>x.id===id);if(c)c.rate=Number(value);saveAll();showToast('บันทึกเรทแล้ว')}
function toggleCard(id,checked){const c=gachaCards.find(x=>x.id===id);if(c)c.active=checked;saveAll();showToast('อัปเดตสถานะการ์ดแล้ว')}
function renderRequests(){const list=messages.filter(m=>m.status==='pending');document.getElementById('admin-content').innerHTML=list.length?list.map(m=>msgBox(m,true)).join(''):'<p class="text-center text-xs text-gray-400 py-8">ไม่มีคำขอข้อความค้างอนุมัติ</p>';lucide.createIcons()}
function approveMsg(id){const m=messages.find(x=>x.id===id);if(m)m.status='approved';saveAll();renderRequests();showToast('อนุมัติข้อความแล้ว')}
function rejectMsg(id){messages=messages.filter(x=>x.id!==id);saveAll();renderRequests();showToast('ลบข้อความแล้ว')}
function renderTeacherMailbox(){const myId=currentUser.teacherId;const approved=messages.filter(m=>m.teacherId===myId&&m.status==='approved'&&m.readStatus!=='archived');const archived=messages.filter(m=>m.teacherId===myId&&m.status==='approved'&&m.readStatus==='archived');const myCards=gachaCards.filter(c=>c.teacherId===myId);document.getElementById('admin-content').innerHTML=`<h3 class="font-medium text-gray-700 mb-2">การ์ดของฉัน</h3><div class="grid grid-cols-3 gap-2 mb-5">${myCards.map(c=>`<img src="${c.imageUrl}" class="rounded-xl border rarity-${c.rarity}">`).join('')||'<p class="text-xs text-gray-400 col-span-3">ยังไม่มีการ์ด</p>'}</div><h3 class="font-medium text-gray-700 mb-2">หีบจดหมาย</h3>${approved.length?approved.map(m=>msgBox(m,false)).join(''):'<p class="text-xs text-gray-400 py-4">ไม่มีจดหมายใหม่</p>'}<details class="mt-4"><summary class="text-sm text-pink-500 cursor-pointer">ข้อความที่จัดเก็บแล้ว (${archived.length})</summary><div class="mt-3">${archived.map(m=>msgBox(m,false,true)).join('')||'<p class="text-xs text-gray-400">ยังไม่มี</p>'}</div></details>`;lucide.createIcons()}
function msgBox(m,admin=false,archived=false){return `<div class="p-4 rounded-2xl bg-pink-50/60 border border-pink-100 mb-3"><div class="flex items-start gap-3"><div class="w-10 h-10 rounded-2xl bg-white flex items-center justify-center text-pink-400"><i data-lucide="mail" class="w-5 h-5"></i></div><div class="flex-1"><p class="text-sm text-gray-700">${m.text}</p><p class="text-xs text-gray-400 mt-1">จาก ${m.senderName} • ถึง ${teachers.find(t=>t.id===m.teacherId)?.name||'-'} • ${m.createdAt}</p>${admin?`<div class="flex gap-2 mt-3"><button onclick="approveMsg('${m.id}')" class="px-3 py-1.5 rounded-full bg-green-500 text-white text-xs">อนุมัติ</button><button onclick="rejectMsg('${m.id}')" class="px-3 py-1.5 rounded-full bg-gray-200 text-gray-600 text-xs">ลบ</button></div>`:(!archived?`<button onclick="archiveMsg('${m.id}')" class="mt-3 px-3 py-1.5 rounded-full bg-pink-500 text-white text-xs">อ่านแล้วจัดเก็บ</button>`:'')}</div></div></div>`}
function archiveMsg(id){const m=messages.find(x=>x.id===id);if(m)m.readStatus='archived';saveAll();renderTeacherMailbox();showToast('จัดเก็บข้อความแล้ว')}
function showToast(msg){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.className='fixed top-4 left-1/2 -translate-x-1/2 bg-pink-600 text-white px-5 py-2 rounded-full text-sm shadow-lg z-50 transition-opacity';document.body.appendChild(t)}t.textContent=msg;t.style.opacity='1';setTimeout(()=>t.style.opacity='0',2500)}
init();
</script>
</body>
