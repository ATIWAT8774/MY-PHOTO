<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MiniMart POS - ระบบขายหน้าร้าน</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#16a34a',
            'primary-dark': '#15803d',
            'primary-soft': '#dcfce7',
            'ink': '#111827'
          }
        }
      }
    }
  </script>
  <style>
    * { font-family: 'Prompt', sans-serif; }
    body { background:#f6f8f7; }
    .card-shadow { box-shadow: 0 8px 26px rgba(15, 23, 42, .06); }
    .soft-border { border:1px solid #e5e7eb; }
    .btn-touch { min-height:48px; }
    .page { display:none; }
    .page.active { display:block; }
    .menu-active { background:#16a34a; color:#fff; }
    .menu-active i { color:#fff; }
    ::-webkit-scrollbar { width:8px; height:8px; }
    ::-webkit-scrollbar-thumb { background:#d1d5db; border-radius:999px; }
    @media print {
      body * { visibility:hidden; }
      #print-area, #print-area * { visibility:visible; }
      #print-area { position:absolute; left:0; top:0; width:80mm; background:white; padding:8px; }
      .no-print { display:none !important; }
    }
  </style>
</head>

<body class="h-screen overflow-hidden text-ink">
  <div class="h-full flex">
    <aside class="w-72 bg-white card-shadow flex flex-col shrink-0 no-print">
      <div class="p-5 border-b border-gray-100">
        <div class="flex items-center gap-3">
          <div class="w-12 h-12 rounded-2xl bg-primary text-white flex items-center justify-center">
            <i data-lucide="store"></i>
          </div>
          <div>
            <h1 id="side-store-name" class="text-xl font-bold text-primary">MiniMart POS</h1>
            <p class="text-xs text-gray-400">ระบบขายหน้าร้าน</p>
          </div>
        </div>
      </div>

      <nav class="flex-1 py-3 overflow-y-auto px-3 space-y-1">
        <button data-page="sales" class="menu-btn menu-active w-full flex items-center gap-3 px-4 py-3.5 rounded-2xl font-medium text-left">
          <i data-lucide="shopping-cart" class="w-5 h-5"></i><span>ขายสินค้า</span>
        </button>
        <button data-page="history" class="menu-btn w-full flex items-center gap-3 px-4 py-3.5 rounded-2xl font-medium text-gray-600 hover:bg-gray-50 text-left">
          <i data-lucide="receipt" class="w-5 h-5"></i><span>ประวัติบิล</span>
        </button>
        <button data-page="products" class="menu-btn w-full flex items-center gap-3 px-4 py-3.5 rounded-2xl font-medium text-gray-600 hover:bg-gray-50 text-left">
          <i data-lucide="package" class="w-5 h-5"></i><span>จัดการสินค้า</span>
        </button>
        <button data-page="stock" class="menu-btn w-full flex items-center gap-3 px-4 py-3.5 rounded-2xl font-medium text-gray-600 hover:bg-gray-50 text-left">
          <i data-lucide="warehouse" class="w-5 h-5"></i><span>สต๊อกสินค้า</span>
        </button>
        <button data-page="returns" class="menu-btn w-full flex items-center gap-3 px-4 py-3.5 rounded-2xl font-medium text-gray-600 hover:bg-gray-50 text-left">
          <i data-lucide="refresh-cw" class="w-5 h-5"></i><span>เปลี่ยน/คืนสินค้า</span>
        </button>
        <button data-page="reports" class="menu-btn w-full flex items-center gap-3 px-4 py-3.5 rounded-2xl font-medium text-gray-600 hover:bg-gray-50 text-left">
          <i data-lucide="bar-chart-3" class="w-5 h-5"></i><span>รายงาน</span>
        </button>
        <button data-page="settings" class="menu-btn w-full flex items-center gap-3 px-4 py-3.5 rounded-2xl font-medium text-gray-600 hover:bg-gray-50 text-left">
          <i data-lucide="settings" class="w-5 h-5"></i><span>ตั้งค่าระบบ</span>
        </button>
      </nav>

      <div class="p-4 border-t border-gray-100">
        <button onclick="resetDemoData()" class="w-full flex items-center justify-center gap-2 px-4 py-3 rounded-2xl text-red-600 bg-red-50 hover:bg-red-100 font-medium">
          <i data-lucide="rotate-ccw" class="w-5 h-5"></i><span>รีเซ็ตข้อมูลตัวอย่าง</span>
        </button>
      </div>
    </aside>

    <main class="flex-1 flex flex-col min-w-0">
      <header class="bg-white card-shadow px-6 py-3 flex items-center justify-between shrink-0 no-print">
        <div>
          <h2 id="top-store-name" class="font-bold text-xl">MiniMart POS</h2>
          <p id="datetime-display" class="text-sm text-gray-500"></p>
        </div>
        <div class="flex items-center gap-3">
          <div class="bg-primary-soft px-4 py-2 rounded-2xl flex items-center gap-2">
            <i data-lucide="trending-up" class="w-5 h-5 text-primary"></i>
            <div>
              <p class="text-xs text-gray-500">ยอดขายวันนี้</p>
              <p id="today-sales" class="text-primary font-bold">0.00 บาท</p>
            </div>
          </div>
          <div class="bg-gray-50 px-4 py-2 rounded-2xl flex items-center gap-2">
            <i data-lucide="user" class="w-5 h-5 text-gray-500"></i>
            <span id="cashier-display" class="font-medium">แอดมิน</span>
          </div>
        </div>
      </header>

      <section id="page-sales" class="page active flex-1 overflow-hidden">
        <div class="h-full flex overflow-hidden">
          <div class="flex-1 p-5 overflow-hidden flex flex-col">
            <div class="flex gap-3 mb-4">
              <div class="relative flex-1">
                <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 w-5 h-5"></i>
                <input id="search-input" type="text" placeholder="ค้นหาสินค้า ชื่อสินค้า รหัสสินค้า หรือบาร์โค้ด"
                  class="w-full pl-12 pr-4 py-4 bg-white soft-border rounded-2xl text-lg focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary">
              </div>
              <button onclick="focusBarcode()" class="btn-touch px-5 bg-white soft-border rounded-2xl hover:bg-gray-50 flex items-center gap-2 font-medium">
                <i data-lucide="scan-line" class="w-5 h-5"></i><span>สแกน</span>
              </button>
            </div>

            <div class="flex gap-2 mb-4 overflow-x-auto pb-1" id="category-filters"></div>
            <div class="flex-1 overflow-y-auto pr-1">
              <div class="grid grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-3" id="products-container"></div>
            </div>
          </div>

          <div class="w-[460px] bg-white card-shadow flex flex-col overflow-hidden shrink-0">
            <div class="px-5 py-4 border-b border-gray-100 flex items-center justify-between">
              <h2 class="font-bold text-xl">ตะกร้าสินค้า</h2>
              <span class="text-sm text-gray-500" id="cart-count">0 รายการ</span>
            </div>

            <div class="flex-1 overflow-y-auto px-5 py-3" id="cart-items"></div>

            <div class="px-5 py-3 border-t border-gray-100">
              <div class="flex items-center justify-between mb-2">
                <span class="text-sm font-semibold">ส่วนลดทั้งบิล</span>
                <button id="toggle-discount" class="text-sm text-primary font-semibold hover:underline">เพิ่ม/ซ่อนส่วนลด</button>
              </div>
              <div id="discount-form" class="hidden space-y-2">
                <div class="grid grid-cols-2 gap-2">
                  <button id="disc-percent" class="py-2.5 rounded-xl bg-primary text-white font-semibold">เปอร์เซ็นต์</button>
                  <button id="disc-amount" class="py-2.5 rounded-xl bg-gray-100 text-gray-600 font-semibold">จำนวนเงิน</button>
                </div>
                <input id="discount-value" type="number" min="0" placeholder="กรอกส่วนลด"
                  class="w-full px-3 py-3 soft-border rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/30">
                <select id="discount-reason" class="w-full px-3 py-3 soft-border rounded-xl focus:outline-none">
                  <option value="">เหตุผลการลด</option>
                  <option value="ลูกค้าประจำ">ลูกค้าประจำ</option>
                  <option value="โปรโมชั่น">โปรโมชั่น</option>
                  <option value="พนักงาน">พนักงาน</option>
                  <option value="สินค้ามีตำหนิ">สินค้ามีตำหนิ</option>
                  <option value="อื่น ๆ">อื่น ๆ</option>
                </select>
              </div>
            </div>

            <div class="px-5 py-3 border-t border-gray-100">
              <span class="text-sm font-semibold block mb-2">ช่องทางการชำระเงิน</span>
              <div class="grid grid-cols-3 gap-2">
                <button id="pay-cash" class="pay-btn py-3 rounded-xl bg-primary text-white font-semibold flex items-center justify-center gap-1">
                  <i data-lucide="banknote" class="w-4 h-4"></i>เงินสด
                </button>
                <button id="pay-transfer" class="pay-btn py-3 rounded-xl bg-gray-100 text-gray-600 font-semibold flex items-center justify-center gap-1">
                  <i data-lucide="smartphone" class="w-4 h-4"></i>โอน
                </button>
                <button id="pay-other" class="pay-btn py-3 rounded-xl bg-gray-100 text-gray-600 font-semibold flex items-center justify-center gap-1">
                  <i data-lucide="credit-card" class="w-4 h-4"></i>อื่น ๆ
                </button>
              </div>

              <div id="cash-section" class="mt-3 space-y-2">
                <input id="cash-received" type="number" min="0" placeholder="รับเงิน"
                  class="w-full px-4 py-3 soft-border rounded-xl text-lg focus:outline-none focus:ring-2 focus:ring-primary/30">
                <div class="flex justify-between text-base">
                  <span class="text-gray-500">เงินทอน</span>
                  <span id="change-amount" class="font-bold text-primary">0.00 บาท</span>
                </div>
              </div>

              <div id="other-section" class="mt-3 hidden space-y-2">
                <select id="other-type" class="w-full px-4 py-3 soft-border rounded-xl focus:outline-none">
                  <option value="ใช้สิทธิ์">ใช้สิทธิ์</option>
                  <option value="ฟรี">ฟรี</option>
                  <option value="เบิกบริษัท">เบิกบริษัท</option>
                  <option value="เครดิตร้าน">เครดิตร้าน</option>
                  <option value="อื่น ๆ">อื่น ๆ</option>
                </select>
                <input id="other-detail" type="text" placeholder="รายละเอียดเพิ่มเติม"
                  class="w-full px-4 py-3 soft-border rounded-xl focus:outline-none">
              </div>
            </div>

            <div class="px-5 py-4 border-t border-gray-100 bg-gray-50">
              <div class="flex justify-between text-base mb-1"><span class="text-gray-500">ยอดรวม</span><span id="subtotal">0.00 บาท</span></div>
              <div class="flex justify-between text-base mb-2"><span class="text-gray-500">ส่วนลด</span><span id="discount-display" class="text-red-500">-0.00 บาท</span></div>
              <div class="flex justify-between items-center">
                <span class="font-bold text-lg">ยอดสุทธิ</span>
                <span id="net-total" class="text-3xl font-bold text-primary">0.00 บาท</span>
              </div>
            </div>

            <div class="px-5 py-4 border-t border-gray-100 grid grid-cols-4 gap-2">
              <button id="btn-checkout" class="btn-touch col-span-2 bg-primary hover:bg-primary-dark text-white font-bold rounded-2xl flex items-center justify-center gap-2 py-3">
                <i data-lucide="check-circle" class="w-5 h-5"></i>ชำระเงิน
              </button>
              <button id="btn-clear" class="btn-touch bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold rounded-2xl py-3">ล้าง</button>
              <button id="btn-hold" class="btn-touch bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold rounded-2xl py-3">พักบิล</button>
            </div>
          </div>
        </div>
      </section>

      <section id="page-history" class="page flex-1 overflow-y-auto p-6"></section>
      <section id="page-products" class="page flex-1 overflow-y-auto p-6"></section>
      <section id="page-stock" class="page flex-1 overflow-y-auto p-6"></section>
      <section id="page-returns" class="page flex-1 overflow-y-auto p-6"></section>
      <section id="page-reports" class="page flex-1 overflow-y-auto p-6"></section>
      <section id="page-settings" class="page flex-1 overflow-y-auto p-6"></section>
    </main>
  </div>

  <div id="success-modal" class="hidden fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4 no-print">
    <div class="bg-white rounded-3xl p-8 max-w-md w-full text-center card-shadow">
      <div class="w-16 h-16 bg-primary-soft rounded-full flex items-center justify-center mx-auto mb-4">
        <i data-lucide="check" class="w-8 h-8 text-primary"></i>
      </div>
      <h3 class="text-2xl font-bold mb-2">ชำระเงินสำเร็จ</h3>
      <p id="success-bill" class="text-gray-500 mb-6"></p>
      <p class="font-semibold mb-3">ต้องการพิมพ์ใบเสร็จหรือไม่</p>
      <div class="space-y-2">
        <button id="btn-print" class="w-full btn-touch bg-primary text-white font-semibold rounded-2xl py-3 flex items-center justify-center gap-2">
          <i data-lucide="printer" class="w-5 h-5"></i>พิมพ์ใบเสร็จ
        </button>
        <button id="btn-preview" class="w-full btn-touch bg-gray-100 text-gray-700 font-semibold rounded-2xl py-3">
          ดูตัวอย่างใบเสร็จ
        </button>
        <button id="btn-no-print" class="w-full btn-touch bg-white soft-border text-gray-700 font-semibold rounded-2xl py-3">
          ไม่พิมพ์
        </button>
      </div>
    </div>
  </div>

  <div id="preview-modal" class="hidden fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4 no-print">
    <div class="bg-white rounded-3xl p-6 max-w-md w-full card-shadow">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-xl font-bold">ตัวอย่างใบเสร็จ</h3>
        <button onclick="closePreview()" class="w-10 h-10 rounded-xl bg-gray-100 flex items-center justify-center"><i data-lucide="x"></i></button>
      </div>
      <div id="receipt-preview" class="bg-gray-50 rounded-2xl p-4 text-sm"></div>
      <button onclick="printReceipt()" class="mt-4 w-full btn-touch bg-primary text-white rounded-2xl font-semibold">พิมพ์ใบเสร็จ</button>
    </div>
  </div>

  <div id="toast" class="hidden fixed bottom-5 right-5 bg-ink text-white px-5 py-3 rounded-2xl card-shadow z-[60] no-print"></div>
  <div id="print-area" class="hidden"></div>

<script>
const KEY = 'modern_green_pos_v1';

const defaultData = {
  settings: { storeName:'MiniMart POS', cashier:'แอดมิน', receiptFooter:'ขอบคุณที่ใช้บริการ' },
  products: [
    { id:'P001', barcode:'8850001', name:'น้ำดื่ม 600ml', price:10, cost:6, stock:48, cat:'เครื่องดื่ม', img:'https://images.pexels.com/photos/327090/pexels-photo-327090.jpeg?auto=compress&cs=tinysrgb&w=400' },
    { id:'P002', barcode:'8850002', name:'มาม่าต้มยำ', price:7, cost:4, stock:120, cat:'อาหาร', img:'https://images.pexels.com/photos/4518665/pexels-photo-4518665.jpeg?auto=compress&cs=tinysrgb&w=400' },
    { id:'P003', barcode:'8850003', name:'มันฝรั่งทอด', price:25, cost:15, stock:36, cat:'ขนม', img:'https://images.pexels.com/photos/13060679/pexels-photo-13060679.jpeg?auto=compress&cs=tinysrgb&w=400' },
    { id:'P004', barcode:'8850004', name:'กาแฟสด', price:45, cost:25, stock:20, cat:'เครื่องดื่ม', img:'https://images.pexels.com/photos/9878735/pexels-photo-9878735.jpeg?auto=compress&cs=tinysrgb&w=400' },
    { id:'P005', barcode:'8850005', name:'นมสด 250ml', price:18, cost:11, stock:60, cat:'เครื่องดื่ม', img:'https://images.pexels.com/photos/14534512/pexels-photo-14534512.jpeg?auto=compress&cs=tinysrgb&w=400' },
    { id:'P006', barcode:'8850006', name:'ขนมปังโฮลวีท', price:35, cost:22, stock:15, cat:'เบเกอรี่', img:'https://images.pexels.com/photos/1775050/pexels-photo-1775050.jpeg?auto=compress&cs=tinysrgb&w=400' },
    { id:'P007', barcode:'8850007', name:'น้ำส้ม 500ml', price:20, cost:12, stock:40, cat:'เครื่องดื่ม', img:'https://images.pexels.com/photos/26791691/pexels-photo-26791691.jpeg?auto=compress&cs=tinysrgb&w=400' },
    { id:'P008', barcode:'8850008', name:'ช็อกโกแลต', price:30, cost:18, stock:50, cat:'ขนม', img:'https://images.pexels.com/photos/4110094/pexels-photo-4110094.jpeg?auto=compress&cs=tinysrgb&w=400' }
  ],
  bills: [],
  returns: [],
  heldBills: []
};

let db = loadDB();
let cart = [];
let discountType = 'percent';
let paymentMethod = 'cash';
let selectedCat = 'ทั้งหมด';
let lastBill = null;

function loadDB(){
  const raw = localStorage.getItem(KEY);
  if(!raw){
    localStorage.setItem(KEY, JSON.stringify(defaultData));
    return structuredClone(defaultData);
  }
  try { return JSON.parse(raw); } 
  catch { return structuredClone(defaultData); }
}
function saveDB(){ localStorage.setItem(KEY, JSON.stringify(db)); }
function money(n){ return (Number(n)||0).toLocaleString('th-TH',{minimumFractionDigits:2, maximumFractionDigits:2}) + ' บาท'; }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.remove('hidden');
  setTimeout(()=>t.classList.add('hidden'), 2200);
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
function getTodayBills(){ return db.bills.filter(b => (b.createdAt||'').slice(0,10) === todayStr() && !b.voided); }

document.addEventListener('DOMContentLoaded', () => {
  lucide.createIcons();
  initEvents();
  updateClock(); setInterval(updateClock,1000);
  applySettings();
  renderCategories();
  renderProducts();
  renderCart();
  renderAllPages();
});

function updateClock(){
  document.getElementById('datetime-display').textContent = new Date().toLocaleString('th-TH', { dateStyle:'full', timeStyle:'medium' });
  updateTodaySales();
}
function updateTodaySales(){
  const total = getTodayBills().reduce((s,b)=>s+b.netTotal,0);
  document.getElementById('today-sales').textContent = money(total);
}
function applySettings(){
  document.getElementById('side-store-name').textContent = db.settings.storeName;
  document.getElementById('top-store-name').textContent = db.settings.storeName;
  document.getElementById('cashier-display').textContent = db.settings.cashier;
}
function categories(){
  return ['ทั้งหมด', ...new Set(db.products.map(p=>p.cat).filter(Boolean))];
}
function renderCategories(){
  const box = document.getElementById('category-filters');
  box.innerHTML = categories().map(cat => `
    <button onclick="setCategory('${cat}')" class="cat-btn px-4 py-2.5 rounded-xl text-sm font-semibold whitespace-nowrap ${selectedCat===cat?'bg-primary text-white':'bg-white soft-border text-gray-600 hover:bg-gray-50'}">${cat}</button>
  `).join('');
}
function setCategory(cat){ selectedCat=cat; renderCategories(); renderProducts(); }
function filteredProducts(){
  const q = document.getElementById('search-input')?.value?.trim().toLowerCase() || '';
  return db.products.filter(p => {
    const matchCat = selectedCat === 'ทั้งหมด' || p.cat === selectedCat;
    const matchQ = !q || p.name.toLowerCase().includes(q) || p.id.toLowerCase().includes(q) || String(p.barcode||'').toLowerCase().includes(q);
    return matchCat && matchQ;
  });
}
function renderProducts(){
  const c = document.getElementById('products-container');
  const list = filteredProducts();
  if(!list.length){
    c.innerHTML = `<div class="col-span-full bg-white rounded-3xl p-10 text-center text-gray-400">ไม่พบสินค้า</div>`;
    return;
  }
  c.innerHTML = list.map(p => `
    <button onclick="addToCart('${p.id}')" class="bg-white rounded-3xl card-shadow p-3 text-left hover:ring-2 hover:ring-primary/30 transition active:scale-[.98] ${p.stock<=0?'opacity-50 pointer-events-none':''}">
      <div class="aspect-square rounded-2xl overflow-hidden bg-gray-50 mb-3">
        <img src="${p.img || ''}" onerror="this.src='https://placehold.co/400x400?text=Product'" alt="${p.name}" class="w-full h-full object-cover" loading="lazy">
      </div>
      <p class="font-semibold text-base text-gray-800 truncate">${p.name}</p>
      <p class="text-primary font-bold text-xl">${money(p.price).replace(' บาท','')}</p>
      <p class="text-sm ${p.stock<=5?'text-red-500':'text-gray-400'}">คงเหลือ ${p.stock} ชิ้น</p>
    </button>
  `).join('');
}
function focusBarcode(){ document.getElementById('search-input').focus(); }

function addToCart(id){
  const p = db.products.find(x=>x.id===id);
  if(!p || p.stock<=0) return showToast('สินค้าไม่พอขาย');
  const existing = cart.find(x=>x.id===id);
  const currentQty = existing ? existing.qty : 0;
  if(currentQty + 1 > p.stock) return showToast('จำนวนเกินสต๊อก');
  if(existing) existing.qty++;
  else cart.push({ id:p.id, name:p.name, price:p.price, cost:p.cost||0, qty:1 });
  renderCart();
}
function renderCart(){
  const box = document.getElementById('cart-items');
  if(!cart.length){
    box.innerHTML = `

        </div>
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2">
            <button onclick="changeQty(${i},-1)" class="w-10 h-10 rounded-xl bg-gray-100 font-bold text-lg">−</button>

            <button onclick="changeQty(${i},1)" class="w-10 h-10 rounded-xl bg-gray-100 font-bold text-lg">+</button>

          <button onclick="removeItem(${i})" class="w-10 h-10 rounded-xl bg-red-50 text-red-500 flex items-center justify-center"><i data-lucide="trash-2" class="w-5 h-5"></i></button>

function changeQty(i,d){
  const item = cart[i];
  const p = db.products.find(x=>x.id===item.id);
  if(d>0 && item.qty+1 > p.stock) return showToast('จำนวนเกินสต๊อก');
  item.qty += d;
  if(item.qty<=0) cart.splice(i,1);
  renderCart();
}
function removeItem(i){ cart.splice(i,1); renderCart(); }
function subtotal(){ return cart.reduce((s,i)=>s+i.price*i.qty,0); }
function discountAmount(){
  const val = Number(document.getElementById('discount-value').value)||0;
  const sub = subtotal();
  let d = discountType==='percent' ? sub*val/100 : val;
  return Math.min(Math.max(0,d), sub);
}
function updateSummary(){
  const sub = subtotal();
  const disc = discountAmount();
  const net = Math.max(0, sub-disc);
  document.getElementById('subtotal').textContent = money(sub);
  document.getElementById('discount-display').textContent = '-' + money(disc);
  document.getElementById('net-total').textContent = money(net);
  const cash = Number(document.getElementById('cash-received').value)||0;
  document.getElementById('change-amount').textContent = money(Math.max(0,cash-net));
}

function initEvents(){
  document.querySelectorAll('.menu-btn').forEach(btn => btn.addEventListener('click', () => switchPage(btn.dataset.page)));
  document.getElementById('search-input').addEventListener('input', renderProducts);
  document.getElementById('toggle-discount').addEventListener('click', ()=>document.getElementById('discount-form').classList.toggle('hidden'));
  document.getElementById('disc-percent').addEventListener('click', ()=>setDiscountType('percent'));
  document.getElementById('disc-amount').addEventListener('click', ()=>setDiscountType('fixed'));
  document.getElementById('discount-value').addEventListener('input', updateSummary);
  document.getElementById('cash-received').addEventListener('input', updateSummary);
  document.getElementById('pay-cash').addEventListener('click', ()=>setPayment('cash'));
  document.getElementById('pay-transfer').addEventListener('click', ()=>setPayment('transfer'));
  document.getElementById('pay-other').addEventListener('click', ()=>setPayment('other'));
  document.getElementById('btn-clear').addEventListener('click', ()=>{ if(confirm('ล้างตะกร้าหรือไม่')){ cart=[]; renderCart(); }});
  document.getElementById('btn-hold').addEventListener('click', holdBill);
  document.getElementById('btn-checkout').addEventListener('click', checkout);
  document.getElementById('btn-no-print').addEventListener('click', closeSuccess);
  document.getElementById('btn-preview').addEventListener('click', previewReceipt);
  document.getElementById('btn-print').addEventListener('click', printReceipt);
}
function switchPage(page){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+page).classList.add('active');
  document.querySelectorAll('.menu-btn').forEach(b=>{
    b.classList.remove('menu-active'); b.classList.add('text-gray-600','hover:bg-gray-50');
  });
  document.querySelector(`[data-page="${page}"]`).classList.add('menu-active');
  document.querySelector(`[data-page="${page}"]`).classList.remove('text-gray-600','hover:bg-gray-50');
  renderAllPages();
}
function setDiscountType(type){
  discountType = type;
  const p = document.getElementById('disc-percent'), a = document.getElementById('disc-amount');
  [p,a].forEach(b=>{ b.classList.remove('bg-primary','text-white'); b.classList.add('bg-gray-100','text-gray-600'); });
  const active = type==='percent'?p:a;
  active.classList.add('bg-primary','text-white'); active.classList.remove('bg-gray-100','text-gray-600');
  updateSummary();
}
function setPayment(method){
  paymentMethod = method;
  document.querySelectorAll('.pay-btn').forEach(b=>{ b.classList.remove('bg-primary','text-white'); b.classList.add('bg-gray-100','text-gray-600'); });
  const active = document.getElementById(method==='cash'?'pay-cash':method==='transfer'?'pay-transfer':'pay-other');
  active.classList.add('bg-primary','text-white'); active.classList.remove('bg-gray-100','text-gray-600');
  document.getElementById('cash-section').classList.toggle('hidden', method!=='cash');
  document.getElementById('other-section').classList.toggle('hidden', method!=='other');
}

function checkout(){
  if(!cart.length) return showToast('ยังไม่มีสินค้าในตะกร้า');
  const sub = subtotal(), disc = discountAmount(), net = Math.max(0, sub-disc);
  const cash = Number(document.getElementById('cash-received').value)||0;
  if(paymentMethod==='cash' && cash < net) return showToast('รับเงินไม่พอ');
  const billNo = 'INV-' + new Date().toISOString().slice(0,10).replaceAll('-','') + '-' + String(db.bills.length+1).padStart(4,'0');
  const bill = {
    billNo, items: cart.map(i=>({...i})), subtotal: sub, discount: disc, discountType,
    discountValue: Number(document.getElementById('discount-value').value)||0,
    discountReason: document.getElementById('discount-reason').value || '',
    netTotal: net, paymentMethod,
    paymentText: paymentMethod==='cash'?'เงินสด':paymentMethod==='transfer'?'โอนเงิน':document.getElementById('other-type').value,
    otherDetail: paymentMethod==='other'?document.getElementById('other-detail').value:'',
    cashReceived: paymentMethod==='cash'?cash:net,
    change: paymentMethod==='cash'?Math.max(0,cash-net):0,
    cashier: db.settings.cashier,
    createdAt: new Date().toISOString(),
    voided:false
  };
  bill.items.forEach(item => {
    const p = db.products.find(x=>x.id===item.id);
    if(p) p.stock -= item.qty;
  });
  db.bills.push(bill);
  saveDB();
  lastBill = bill;
  cart = [];
  document.getElementById('discount-value').value = '';
  document.getElementById('cash-received').value = '';
  renderProducts(); renderCart(); renderAllPages(); updateTodaySales();
  document.getElementById('success-bill').textContent = billNo + ' | ยอดสุทธิ ' + money(net);
  document.getElementById('success-modal').classList.remove('hidden');
}
function closeSuccess(){ document.getElementById('success-modal').classList.add('hidden'); }
function holdBill(){
  if(!cart.length) return showToast('ยังไม่มีสินค้าให้พักบิล');
  db.heldBills.push({ id:'H'+Date.now(), items:cart, createdAt:new Date().toISOString() });
  saveDB(); cart=[]; renderCart(); showToast('พักบิลแล้ว');
}

function saveProduct(e){
  e.preventDefault();
  const id = document.getElementById('product-id').value.trim();
  if(!id) return showToast('กรุณากรอกรหัสสินค้า');
  const p = {
    id, barcode:document.getElementById('product-barcode').value.trim(),
    name:document.getElementById('product-name').value.trim(),
    price:Number(document.getElementById('product-price').value)||0,
    cost:Number(document.getElementById('product-cost').value)||0,
    stock:Number(document.getElementById('product-stock').value)||0,
    cat:document.getElementById('product-cat').value.trim() || 'ทั่วไป',
    img:document.getElementById('product-img').value.trim()
  };
  if(!p.name) return showToast('กรุณากรอกชื่อสินค้า');
  const idx = db.products.findIndex(x=>x.id===id);
  if(idx>=0) db.products[idx]=p; else db.products.push(p);
  saveDB(); renderCategories(); renderProducts(); renderAllPages(); showToast('บันทึกสินค้าแล้ว');
}
function editProduct(id){
  const p = db.products.find(x=>x.id===id);
  if(!p) return;
  switchPage('products');
  setTimeout(()=>{
    document.getElementById('product-id').value=p.id;
    document.getElementById('product-barcode').value=p.barcode||'';
    document.getElementById('product-name').value=p.name;
    document.getElementById('product-price').value=p.price;
    document.getElementById('product-cost').value=p.cost||0;
    document.getElementById('product-stock').value=p.stock;
    document.getElementById('product-cat').value=p.cat;
    document.getElementById('product-img').value=p.img||'';
  },0);
}
function deleteProduct(id){
  if(!confirm('ลบสินค้านี้หรือไม่')) return;
  db.products = db.products.filter(p=>p.id!==id);
  saveDB(); renderCategories(); renderProducts(); renderAllPages();
}

}
function renderSettingsPage(){
  document.getElementById('page-settings').innerHTML = pageTitle('ตั้งค่าระบบ','ตั้งค่าชื่อร้าน ผู้ขาย และข้อความท้ายใบเสร็จ') + `
    <form onsubmit="saveSettings(event)" class="bg-white rounded-3xl card-shadow p-6 max-w-xl space-y-3">
      <label class="font-semibold">ชื่อร้าน</label>
      <input id="set-store" value="${db.settings.storeName}" class="w-full p-4 soft-border rounded-2xl">
      <label class="font-semibold">ชื่อพนักงาน/ผู้ขาย</label>
      <input id="set-cashier" value="${db.settings.cashier}" class="w-full p-4 soft-border rounded-2xl">
      <label class="font-semibold">ข้อความท้ายใบเสร็จ</label>
      <input id="set-footer" value="${db.settings.receiptFooter}" class="w-full p-4 soft-border rounded-2xl">
      <button class="btn-touch px-6 bg-primary text-white rounded-2xl font-bold">บันทึกการตั้งค่า</button>
    </form>`;
}
function saveSettings(e){
  e.preventDefault();
  db.settings.storeName = document.getElementById('set-store').value.trim() || 'MiniMart POS';
  db.settings.cashier = document.getElementById('set-cashier').value.trim() || 'แอดมิน';
  db.settings.receiptFooter = document.getElementById('set-footer').value.trim() || 'ขอบคุณที่ใช้บริการ';
  saveDB(); applySettings(); renderAllPages(); showToast('บันทึกการตั้งค่าแล้ว');
}
function resetDemoData(){
  if(!confirm('รีเซ็ตข้อมูลทั้งหมดกลับเป็นตัวอย่างหรือไม่')) return;
  localStorage.setItem(KEY, JSON.stringify(defaultData));
  db = loadDB(); cart=[]; selectedCat='ทั้งหมด';
  applySettings(); renderCategories(); renderProducts(); renderCart(); renderAllPages(); updateTodaySales();
}
</script>
</body>
</html>
