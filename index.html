<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">

<title>Pre-order | ศาลเจ้าปึงเฒ่ากง</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

/* =========================================================
   DESIGN SYSTEM
========================================================= */

:root{
  --pink:#D85C83;
  --pink-dark:#B83E67;
  --pink-light:#FFF2F6;
  --pink-soft:#FFE2EB;

  --red:#A93253;

  --ink:#2F252A;
  --gray:#817279;
  --gray-light:#B7A9AE;

  --line:#EDE0E5;

  --white:#FFFFFF;
  --bg:#FFF9FB;

  --success:#3E9B6A;

  --shadow:
    0 18px 50px rgba(90,35,55,.10);

  --radius:20px;
}


/* =========================================================
   RESET
========================================================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  font-family:
    "Noto Sans Thai",
    sans-serif;

  background:var(--bg);

  color:var(--ink);

  -webkit-font-smoothing:antialiased;
}

button,
input,
textarea{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

input,
textarea{
  outline:none;
}

img,
svg{
  display:block;
  max-width:100%;
}

h1,
h2,
h3,
p,
span,
button,
label{
  overflow-wrap:anywhere;
}


/* =========================================================
   APP
========================================================= */

#app{
  width:100%;
  height:100dvh;

  display:flex;
  flex-direction:column;

  overflow:hidden;
}


/* =========================================================
   HEADER
========================================================= */

.header{
  width:100%;
  height:68px;
  min-height:68px;

  padding:
    0
    max(18px,env(safe-area-inset-right))
    0
    max(18px,env(safe-area-inset-left));

  background:
    rgba(255,255,255,.94);

  border-bottom:
    1px solid var(--line);

  display:grid;

  grid-template-columns:
    1fr
    auto
    1fr;

  align-items:center;

  position:relative;

  z-index:100;

  backdrop-filter:blur(18px);
}

.header-side{
  min-width:0;
}

.header-side.right{
  display:flex;
  justify-content:flex-end;
}

.brand{
  display:flex;
  align-items:center;

  gap:9px;

  min-width:0;
}

.logo{
  width:39px;
  height:39px;

  flex:0 0 39px;

  display:grid;
  place-items:center;

  color:#fff;

  font-size:17px;
  font-weight:800;

  border-radius:13px;

  background:
    linear-gradient(
      135deg,
      var(--pink),
      var(--pink-dark)
    );

  box-shadow:
    0 8px 20px rgba(216,92,131,.22);
}

.brand-text{
  min-width:0;
}

.brand-text strong{
  display:block;

  font-size:13px;

  line-height:1.2;

  white-space:nowrap;
}

.brand-text small{
  display:block;

  margin-top:3px;

  color:var(--gray);

  font-size:8px;

  white-space:nowrap;
}

.header-button{
  width:40px;
  height:40px;

  display:grid;
  place-items:center;

  border:
    1px solid var(--line);

  border-radius:12px;

  color:var(--pink);

  background:#fff;
}

.header-button svg{
  width:18px;
  height:18px;
}


/* =========================================================
   MAIN VIEW
========================================================= */

#view{
  width:100%;
  height:calc(100dvh - 68px);

  min-width:0;
  min-height:0;

  overflow:hidden;

  position:relative;
}


/* =========================================================
   PAGE
========================================================= */

.page{
  width:100%;
  height:100%;

  min-width:0;
  min-height:0;

  overflow-y:auto;
  overflow-x:hidden;

  padding:
    32px
    max(22px,env(safe-area-inset-right))
    110px
    max(22px,env(safe-area-inset-left));

  animation:
    pageEnter .25s ease;
}

@keyframes pageEnter{

  from{
    opacity:0;
    transform:translateX(18px);
  }

  to{
    opacity:1;
    transform:translateX(0);
  }

}

.container{
  width:100%;
  max-width:1080px;

  min-width:0;

  margin:0 auto;
}


/* =========================================================
   DECORATION
========================================================= */

.lotus-decoration{
  position:fixed;

  pointer-events:none;

  color:var(--pink);

  opacity:.065;

  z-index:0;
}

.lotus-decoration.top{
  width:330px;
  height:330px;

  top:-100px;
  right:-90px;

  transform:rotate(10deg);
}

.lotus-decoration.bottom{
  width:260px;
  height:260px;

  bottom:-100px;
  left:-100px;

  transform:rotate(-15deg);
}

.chinese-ring{
  position:absolute;

  width:190px;
  height:190px;

  right:4%;
  top:10%;

  border:
    1px solid var(--pink);

  border-radius:50%;

  opacity:.07;

  pointer-events:none;
}

.chinese-ring::before{
  content:"";

  position:absolute;

  inset:14px;

  border:
    1px solid var(--pink);

  border-radius:50%;
}

.chinese-ring::after{
  content:"";

  position:absolute;

  inset:34px;

  border:
    1px solid var(--pink);

  border-radius:50%;
}


/* =========================================================
   TEXT
========================================================= */

.kicker{
  color:var(--pink);

  font-size:10px;

  font-weight:800;

  letter-spacing:2px;

  margin-bottom:9px;
}

.title{
  font-size:
    clamp(28px,5vw,48px);

  line-height:1.18;

  font-weight:800;
}

.subtitle{
  margin-top:10px;

  max-width:620px;

  color:var(--gray);

  font-size:13px;

  line-height:1.8;
}


/* =========================================================
   HOME
========================================================= */

.home{
  width:100%;
  min-height:100%;

  display:grid;

  grid-template-columns:
    minmax(0,1fr)
    minmax(0,1fr);

  align-items:center;

  gap:50px;

  position:relative;

  z-index:2;
}

.home-content{
  min-width:0;
}

.home-title{
  font-size:
    clamp(38px,6vw,70px);

  line-height:1.08;

  font-weight:800;
}

.home-title em{
  color:var(--pink);

  font-style:normal;
}

.home-description{
  max-width:500px;

  margin-top:20px;

  color:var(--gray);

  font-size:14px;

  line-height:1.9;
}

.price{
  margin-top:20px;
}

.price small{
  display:block;

  color:var(--gray);

  font-size:10px;
}

.price strong{
  color:var(--pink);

  font-size:35px;

  font-weight:800;
}

.price span{
  color:var(--gray);

  font-size:10px;
}


/* =========================================================
   SHIRT MOCKUP
========================================================= */

.shirt-area{
  min-width:0;

  display:flex;

  justify-content:center;
  align-items:center;

  position:relative;
}

.shirt{
  width:min(380px,82%);
  aspect-ratio:.82;

  position:relative;

  filter:
    drop-shadow(
      0 30px 30px
      rgba(50,20,30,.16)
    );
}


/* BODY */

.shirt-body{
  position:absolute;

  left:17%;
  right:17%;

  top:17%;
  bottom:5%;

  border-radius:
    12px
    12px
    24px
    24px;

  background:
    linear-gradient(
      110deg,
      #ffffff 0%,
      #f8f6f7 50%,
      #e7e2e4 100%
    );

  box-shadow:
    inset -13px 0 20px rgba(0,0,0,.035),
    inset 12px 0 20px rgba(255,255,255,.7);
}


/* LEFT SLEEVE */

.shirt-left{
  position:absolute;

  left:0;
  top:12%;

  width:29%;
  height:32%;

  background:
    linear-gradient(
      135deg,
      #fff,
      #e9e5e7
    );

  clip-path:
    polygon(
      43% 0,
      100% 18%,
      78% 100%,
      0 72%
    );
}


/* RIGHT SLEEVE */

.shirt-right{
  position:absolute;

  right:0;
  top:12%;

  width:29%;
  height:32%;

  background:
    linear-gradient(
      225deg,
      #fff,
      #e9e5e7
    );

  clip-path:
    polygon(
      0 18%,
      57% 0,
      100% 72%,
      22% 100%
    );
}


/* NECK */

.shirt-neck{
  position:absolute;

  left:50%;
  top:12%;

  width:29%;
  height:13%;

  transform:translateX(-50%);

  background:#ddd7d9;

  border-radius:
    0
    0
    50%
    50%;

  z-index:3;
}


/* PRINT */

.shirt-print{
  position:absolute;

  left:29%;
  right:29%;

  top:34%;
  height:32%;

  z-index:5;

  display:flex;

  flex-direction:column;

  justify-content:center;

  align-items:center;

  text-align:center;

  color:var(--pink);
}

.shirt-print svg{
  width:65px;
  height:48px;

  margin-bottom:7px;
}

.shirt-print strong{
  font-size:13px;

  font-weight:800;
}

.shirt-print small{
  margin-top:3px;

  font-size:6px;

  letter-spacing:2px;
}


/* HEM */

.shirt-hem{
  position:absolute;

  left:19%;
  right:19%;

  bottom:4%;

  height:4px;

  border-radius:999px;

  background:
    repeating-linear-gradient(
      90deg,
      var(--pink) 0 7px,
      transparent 7px 12px
    );

  opacity:.7;

  z-index:5;
}


/* =========================================================
   BUTTONS
========================================================= */

.primary{
  width:100%;
  min-width:0;

  min-height:52px;

  padding:12px 18px;

  display:flex;

  align-items:center;
  justify-content:center;

  gap:8px;

  border-radius:15px;

  color:#fff;

  background:
    linear-gradient(
      135deg,
      var(--pink),
      var(--pink-dark)
    );

  font-size:13px;

  font-weight:800;

  box-shadow:
    0 12px 25px
    rgba(216,92,131,.2);

  transition:.2s;
}

.primary:hover{
  transform:translateY(-1px);
}

.secondary{
  width:100%;
  min-height:52px;

  margin-top:9px;

  border:
    1px solid var(--line);

  border-radius:15px;

  color:var(--ink);

  background:#fff;

  font-size:13px;

  font-weight:700;
}

.primary svg{
  width:17px;
  height:17px;

  flex:0 0 17px;
}


/* =========================================================
   BOTTOM BAR
========================================================= */

.bottom-bar{
  position:fixed;

  left:0;
  right:0;
  bottom:0;

  width:100%;

  padding:
    11px
    max(18px,env(safe-area-inset-right))
    max(11px,env(safe-area-inset-bottom))
    max(18px,env(safe-area-inset-left));

  background:
    rgba(255,255,255,.95);

  border-top:
    1px solid var(--line);

  backdrop-filter:blur(18px);

  z-index:90;
}

.bottom-content{
  width:100%;
  max-width:1080px;

  margin:auto;

  display:flex;

  gap:9px;

  min-width:0;
}

.back-button{
  width:52px;
  min-width:52px;
  height:52px;

  display:grid;
  place-items:center;

  border:
    1px solid var(--line);

  border-radius:15px;

  background:#fff;

  color:var(--pink);
}

.back-button svg{
  width:19px;
  height:19px;
}


/* =========================================================
   PRODUCT PAGE
========================================================= */

.product-layout{
  width:100%;
  min-height:100%;

  display:grid;

  grid-template-columns:
    minmax(0,1fr)
    minmax(0,1fr);

  align-items:center;

  gap:45px;
}

.product-card{
  min-width:0;

  min-height:450px;

  display:grid;
  place-items:center;

  border:
    1px solid var(--line);

  border-radius:28px;

  background:
    radial-gradient(
      circle at center,
      #fff,
      #fff0f4
    );

  overflow:hidden;
}

.product-card .shirt{
  width:310px;
}

.info{
  min-width:0;
}

.info h2{
  font-size:30px;

  line-height:1.3;

  font-weight:800;
}

.info p{
  margin-top:12px;

  color:var(--gray);

  font-size:13px;

  line-height:1.8;
}

.tags{
  display:flex;

  flex-wrap:wrap;

  gap:7px;

  margin:22px 0;
}

.tag{
  padding:6px 10px;

  border-radius:999px;

  background:var(--pink-light);

  color:var(--pink);

  font-size:9px;

  font-weight:800;
}


/* =========================================================
   SIZE
========================================================= */

.narrow{
  width:100%;
  max-width:720px;

  min-width:0;

  margin:auto;
}

.size-grid{
  width:100%;

  display:grid;

  grid-template-columns:
    repeat(3,minmax(0,1fr));

  gap:10px;

  margin-top:25px;
}

.size-card{
  min-width:0;

  padding:15px;

  border:
    1px solid var(--line);

  border-radius:17px;

  background:#fff;

  transition:.2s;
}

.size-card.selected{
  border-color:var(--pink);

  background:var(--pink-light);

  box-shadow:
    0 0 0 3px
    rgba(216,92,131,.06);
}

.size-name{
  font-size:18px;

  font-weight:800;
}

.size-meta{
  margin-top:2px;

  color:var(--gray);

  font-size:9px;
}

.counter{
  display:flex;

  align-items:center;

  justify-content:space-between;

  margin-top:12px;

  padding:3px;

  border:
    1px solid var(--line);

  border-radius:10px;

  background:#fff;
}

.counter button{
  width:28px;
  height:28px;

  flex:0 0 28px;

  border-radius:8px;

  color:var(--pink);

  background:var(--pink-light);

  font-size:18px;
}

.counter span{
  min-width:20px;

  text-align:center;

  font-size:12px;

  font-weight:800;
}


/* =========================================================
   SIZE TABLE
========================================================= */

.table-box{
  width:100%;

  margin-top:25px;

  border:
    1px solid var(--line);

  border-radius:17px;

  overflow:hidden;
}

.table-scroll{
  width:100%;

  overflow-x:auto;
}

table{
  width:100%;

  min-width:430px;

  border-collapse:collapse;
}

th,
td{
  padding:12px;

  border-bottom:
    1px solid #F2E9ED;

  text-align:center;

  font-size:11px;
}

th{
  color:var(--pink);

  background:#FFF5F8;

  font-weight:800;
}


/* =========================================================
   FORMS
========================================================= */

.form-card{
  width:100%;

  margin-top:25px;

  padding:22px;

  border:
    1px solid var(--line);

  border-radius:20px;

  background:#fff;

  box-shadow:var(--shadow);
}

.form-group{
  width:100%;

  margin-bottom:17px;
}

.form-group:last-child{
  margin-bottom:0;
}

.form-label{
  display:block;

  margin-bottom:7px;

  font-size:11px;

  font-weight:800;
}

.input{
  width:100%;
  max-width:100%;
  min-width:0;

  height:50px;

  padding:
    0
    14px;

  border:
    1px solid var(--line);

  border-radius:13px;

  background:#fff;

  color:var(--ink);

  font-size:13px;
}

.input:focus{
  border-color:var(--pink);

  box-shadow:
    0 0 0 4px
    rgba(216,92,131,.08);
}

textarea.input{
  height:110px;

  padding-top:13px;

  resize:none;
}


/* =========================================================
   DELIVERY
========================================================= */

.delivery-grid{
  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:12px;

  margin-top:25px;
}

.delivery-card{
  min-width:0;

  padding:21px;

  text-align:left;

  border:
    1px solid var(--line);

  border-radius:19px;

  background:#fff;

  transition:.2s;
}

.delivery-card.selected{
  border-color:var(--pink);

  background:var(--pink-light);
}

.delivery-card svg{
  width:27px;
  height:27px;

  color:var(--pink);

  margin-bottom:13px;
}

.delivery-card strong{
  display:block;

  font-size:14px;
}

.delivery-card p{
  margin-top:5px;

  color:var(--gray);

  font-size:10px;

  line-height:1.7;
}


/* =========================================================
   SUMMARY
========================================================= */

.summary-card{
  width:100%;

  margin-top:25px;

  padding:21px;

  border:
    1px solid var(--line);

  border-radius:20px;

  background:#fff;

  box-shadow:var(--shadow);
}

.summary-row{
  display:flex;

  align-items:flex-start;

  justify-content:space-between;

  gap:15px;

  padding:12px 0;

  border-bottom:
    1px solid #F2E9ED;

  font-size:12px;
}

.summary-row span{
  flex:0 0 auto;

  color:var(--gray);
}

.summary-row strong{
  min-width:0;

  max-width:65%;

  text-align:right;
}

.total-row{
  display:flex;

  justify-content:space-between;

  align-items:end;

  gap:12px;

  padding-top:18px;
}

.total-row span{
  color:var(--gray);

  font-size:11px;
}

.total-row strong{
  color:var(--pink);

  font-size:28px;
}


/* =========================================================
   PAYMENT
========================================================= */

.payment{
  width:100%;
  max-width:540px;

  min-width:0;

  margin:auto;

  text-align:center;
}

.payment-price{
  margin-top:3px;

  color:var(--pink);

  font-size:32px;

  font-weight:800;
}

.payment-card{
  width:100%;

  margin-top:25px;

  padding:22px;

  border:
    1px solid var(--line);

  border-radius:22px;

  background:#fff;

  box-shadow:var(--shadow);
}

.qr{
  width:min(220px,65vw);
  aspect-ratio:1;

  margin:5px auto 17px;

  border:12px solid #fff;

  border-radius:15px;

  background:
    repeating-linear-gradient(
      45deg,
      #222 0 3px,
      #fff 3px 7px
    );

  box-shadow:
    0 10px 30px rgba(0,0,0,.1);
}

.upload{
  width:100%;

  display:block;

  padding:20px;

  border:
    1.5px dashed var(--pink);

  border-radius:15px;

  background:var(--pink-light);

  cursor:pointer;
}

.upload input{
  display:none;
}

.upload strong{
  display:block;

  color:var(--pink);

  font-size:12px;
}

.upload span{
  display:block;

  margin-top:4px;

  color:var(--gray);

  font-size:9px;
}


/* =========================================================
   SUCCESS
========================================================= */

.success{
  width:100%;
  min-height:100%;

  display:grid;
  place-items:center;

  text-align:center;
}

.success-box{
  width:100%;
  max-width:500px;
}

.success-icon{
  width:72px;
  height:72px;

  margin:0 auto 20px;

  display:grid;
  place-items:center;

  border-radius:50%;

  color:var(--success);

  background:#ECF8F1;
}

.success-icon svg{
  width:32px;
  height:32px;
}

.order-number{
  width:100%;

  margin:22px 0;

  padding:17px;

  border-radius:16px;

  background:var(--pink-light);
}

.order-number small{
  display:block;

  color:var(--gray);

  font-size:10px;
}

.order-number strong{
  display:block;

  margin-top:3px;

  color:var(--pink);

  font-size:21px;

  letter-spacing:1px;
}


/* =========================================================
   TRACKING
========================================================= */

.tracking{
  width:100%;
  max-width:600px;

  margin:auto;
}

.status-card{
  display:none;

  margin-top:17px;

  padding:16px;

  border-radius:15px;

  background:var(--pink-light);
}

.status-card strong{
  display:block;

  color:var(--pink);

  font-size:12px;
}

.status-card span{
  display:block;

  margin-top:3px;

  color:var(--gray);

  font-size:10px;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:760px){

  .header{
    height:62px;
    min-height:62px;
  }

  #view{
    height:calc(100dvh - 62px);
  }

  .page{
    padding:
      23px
      max(14px,env(safe-area-inset-right))
      96px
      max(14px,env(safe-area-inset-left));
  }


  /* HOME */

  .home{
    display:flex;

    flex-direction:column;

    justify-content:center;

    text-align:center;

    gap:5px;
  }

  .home-content{
    display:flex;

    flex-direction:column;

    align-items:center;
  }

  .home-title{
    font-size:
      clamp(34px,10vw,48px);
  }

  .home-description{
    max-width:330px;

    margin-top:12px;

    font-size:12px;
  }

  .price{
    margin-top:12px;
  }

  .price strong{
    font-size:28px;
  }

  .shirt-area{

  name:'',

const delivery = {

/* =========================================================
   NAVIGATION
========================================================= */

let currentPage = 'home';

let pageHistory = [];


function navigate(page){

  if(page !== currentPage){

    pageHistory.push(currentPage);

  }

  currentPage = page;

  render();

}


function back(){

  if(pageHistory.length === 0){

    return;

  }

  currentPage =
    pageHistory.pop();

  render();

}


function openTracking(){

  navigate('tracking');

}


/* =========================================================
   RENDER
========================================================= */

function render(){

  document.getElementById('view').innerHTML =
    page(currentPage);

  updateNavigation();

  const active =
    document.querySelector('.page');

  if(active){

    active.scrollTop = 0;

  }

}


/* =========================================================
   PAGE SWITCH
========================================================= */

function page(name){

  switch(name){

    case 'home':
      return homePage();

    case 'product':
      return productPage();

    case 'size':
      return sizePage();

    case 'customer':
      return customerPage();

    case 'delivery':
      return deliveryPage();

    case 'summary':
      return summaryPage();

    case 'payment':
      return paymentPage();

    case 'success':
      return successPage();

    case 'tracking':
      return trackingPage();

    default:
      return homePage();

  }

}


/* =========================================================
   NAVIGATION UI
========================================================= */

function updateNavigation(){

  const headerBack =
    document.getElementById('headerBack');

  const bottomBack =
    document.getElementById('bottomBack');

  const bottomBar =
    document.getElementById('bottomBar');

  const nextButton =
    document.getElementById('nextButton');


  const isHome =
    currentPage === 'home';

  const isTracking =
    currentPage === 'tracking';

  const isSuccess =
    currentPage === 'success';


  headerBack.style.visibility =
    isHome ? 'hidden' : 'visible';


  bottomBack.style.display =
    isHome ||
    isTracking ||
    isSuccess
      ? 'none'
      : 'grid';


  bottomBar.style.display =
    isTracking ||
    isSuccess
      ? 'none'
      : 'block';


  const labels = {

    home:
      'ดูรายละเอียดเสื้อ',

    product:

    size:

    summary:

    payment:
      'ยืนยันคำสั่งซื้อ'

  };


  if(labels[currentPage]){

}

/* =========================================================
   LOGIC
========================================================= */

function totalQuantity(){

return Object.values(sizes)
.reduce(
(sum,item) =>
sum + item.qty,
0
);

}


function changeSize(size,amount){

sizes[size].qty =
Math.max(
0,
sizes[size].qty + amount
);

render();

}


/* =========================================================
   CUSTOMER
========================================================= */

function saveCustomer(){

const name =
document.getElementById('name');

const phone =
document.getElementById('phone');

const line =
document.getElementById('line');


if(!name.value.trim()){

alert('กรุณากรอกชื่อ - นามสกุล');

return false;

}


if(!phone.value.trim()){

alert('กรุณากรอกเบอร์โทรศัพท์');

return false;

}


customer.name =
name.value.trim();

customer.phone =
phone.value.trim();

customer.line =
line.value.trim();


return true;

}


/* =========================================================
   DELIVERY
========================================================= */

function chooseDelivery(type){

delivery.type =
type;

render();

}


function saveDelivery(){

if(!delivery.type){

alert('กรุณาเลือกวิธีรับสินค้า');

return false;

}


if(delivery.type === 'shipping'){

const address =
document.getElementById('address');


if(!address ||
!address.value.trim()){

alert(
'กรุณากรอกที่อยู่จัดส่ง'
);

return false;

}


delivery.address =
address.value.trim();

}


return true;

}


/* =========================================================
   NEXT
========================================================= */

function next(){

switch(currentPage){

case 'home':

navigate('product');

break;


case 'product':

navigate('size');

break;


case 'size':

if(totalQuantity() === 0){

alert(
'กรุณาเลือกไซซ์และจำนวนเสื้อ'
);

return;

}

navigate('customer');

break;


case 'customer':

if(!saveCustomer()){

return;

}

navigate('delivery');

break;


case 'delivery':

if(!saveDelivery()){

return;

}

navigate('summary');

break;


case 'summary':

navigate('payment');

break;


case 'payment':

navigate('success');

break;

}

}

function uploadSlip(input){

const target =
document.getElementById('slipName');


if(input.files.length){

target.textContent =
input.files[0].name;

}

}


/* =========================================================
   TRACKING
========================================================= */

function checkOrder(){

const number =
document
.getElementById('orderNumber')
.value
.trim();

const phone =
document
.getElementById('trackPhone')
.value
.trim();


if(!number || !phone){

alert(
'กรุณากรอกข้อมูลให้ครบ'
);

return;

}


const status =
document.getElementById('statusCard');

status.style.display =
'block';

}


/* =========================================================
   ESCAPE
========================================================= */

function escape(value){

return String(value || '')
.replace(/&/g,'&amp;')
.replace(/</g,'&lt;')
.replace(/>/g,'&gt;')
.replace(/"/g,'&quot;')
.replace(/'/g,'&#039;');

}
